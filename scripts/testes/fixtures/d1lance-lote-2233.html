7, 77, 77);\&quot;&gt;Deposit\u00e1rio: &lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;Felipe dos Santos Souza e Amanda Larissa de Souza.&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;\u00d4nus:&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt; Aliena\u00e7\u00e3o Fiduci\u00e1ria em favor da Caixa Econ\u00f4mica Federal - CEF (R.4-22\/08\/17) e penhora em favor do Exequente (Av.6-18\/04\/23).&lt;\/span&gt;&lt;\/p&gt;&lt;p class=\&quot;ql-align-justify\&quot;&gt;&amp;nbsp;&lt;\/p&gt;&lt;p class=\&quot;ql-align-justify\&quot;&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;D\u00e9bitos:&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;&amp;nbsp;Eventuais \u00f4nus e d\u00e9bitos, inclusive os de natureza&amp;nbsp;&lt;\/span&gt;&lt;em style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;propter rem&lt;\/em&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;&amp;nbsp;(tribut\u00e1rios, fiscais, multas e taxas), ser\u00e3o sub-rogados no valor da arremata\u00e7\u00e3o, consoante a ordem das respectivas prefer\u00eancias (arts. 130\/186-CTN e 908-CPC), e, caso o saldo n\u00e3o seja suficiente para quita\u00e7\u00e3o, cabe ao pr\u00f3prio arrematante depositar o valor dos referidos tributos para serem acrescidos ao saldo devedor exequendo.&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;- IPTU:&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt; N\u00e3o h\u00e1 (em 10\/2026).&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;- Condom\u00ednio:&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt; R$ 12.956,00 (em 10\/2022).&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;Aliena\u00e7\u00e3o Fiduci\u00e1ria:&lt;\/strong&gt;&l
