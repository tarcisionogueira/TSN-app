gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;Informa\u00e7\u00f5es complementares: &lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;Referido im\u00f3vel conta com a seguinte divis\u00e3o: im\u00f3vel Frontal: pavimento t\u00e9rreo com sala, cozinha, lavabo, jardim de inverno, lavanderia, garagem e piscina. Pavimento superior com 3 su\u00edtes, 1 quarto e 1 banheiro. Ed\u00edcula: banheiro, churrasqueira e sala de escrit\u00f3rio\/academia. Estado de conserva\u00e7\u00e3o do im\u00f3vel: Edifica\u00e7\u00e3o cujo estado geral possa ser recuperado com pintura interna e externa, ap\u00f3s reparos de fissuras e trincas superficiais generalizadas, sem recupera\u00e7\u00e3o do sistema estruturas. Eventualmente, revis\u00e3o do sistema hidr\u00e1ulico e el\u00e9trico. Ademais, conforme informado pela Exequente o im\u00f3vel conta um quintal para estender roupas, aquecimento solar por placas, arm\u00e1rios embutidos nos quartos, cozinha e lavanderia, al\u00e9m de contar com aquecimento central e da piscina.&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;Valor de Avalia\u00e7\u00e3o:&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt; R$ 3.846.116,67 (em 08\/2026 - ser\u00e1 atualizado at\u00e9 a data do leil\u00e3o)&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;IPTU Mensal:&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt; R$ 2.002,24 &lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;Deposit\u00e1rio: &lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;Jos\u00e9 Claudio Zoia&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;&lt;p class=\&quot;ql-align-justify\&quot;&gt;&amp;nbsp;&lt;\/p&gt;&lt;p class=\&quot;ql-align-justify\&quot;&gt;&lt;strong style=\&quot;color: rgb(68, 68, 68);\&quot;&gt;D\u00e9bitos:&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(68, 68, 68);\&quot;&gt;&amp;nbsp;O arrematante n\u00e3o possui responsabilidades pelos d\u00e9bitos tribut\u00e1rios que j\u00e1 incidiam sobre o im\u00f3vel na data de sua aliena\u00e7\u00e3o (arts. 130\/186-CTN e Tese 1134 do STJ).&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(77, 77, 77);\&quot;&gt;- IPTU:&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(77, 77, 77);\&quot;&gt; R$ 358.232,22 (em 08\/2026)&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&lt;br&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(68, 68, 68);\&quot;&gt;Demais D\u00e9bitos:&amp;nbsp;&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(68, 68, 68);\&quot;&gt;Eventuais \u00f4nus e outros d\u00e9bitos, inclusive os de natureza&amp;nbsp;propter rem (condominiais), ser\u00e3o sub-rogados no valor da arremata\u00e7\u00e3o, consoante a ordem das respectivas prefer\u00eancias (art. 908-CPC).&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&lt;br&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(68, 68, 68);\&quot;&gt;BAIXAS REGISTRAIS:&lt;\/strong&gt;&lt;span style=\&quot;color: rgb(68, 68, 68);\&quot;&gt;&amp;nbsp;Finalizada a arremata\u00e7\u00e3o, mediante solicita\u00e7\u00e3o do arrematante e cumpridas as disposi\u00e7\u00f5es e exig\u00eancias legais, o MM. Ju\u00edzo determinar\u00e1 a baixa\/cancelamento de penhoras, arrestos, hipotecas e indisponibilidades que recaiam sobre o(s) bem(ns)(art. 320-G do Prov. 188\/24- CNJ).&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;br&gt;&lt;\/p&gt;&lt;p&gt;&lt;span style=\&quot;color: rgb(161, 0, 0);\&quot;&gt;- Aquele que tentar fraudar a arremata\u00e7\u00e3o, al\u00e9m da repara\u00e7\u00e3o do dano na esfera c\u00edvel - arts. 186 e 927 do C\u00f3digo Civil - ficar\u00e1 sujeito as penalidades do artigo 358 do C\u00f3digo Penal: Art. 358 - Impedir, perturbar ou fraudar arremata\u00e7\u00e3o judicial; afastar ou procurar afastar concorrente ou licitante, por meio de viol\u00eancia, grave amea\u00e7a, fraude ou oferecimento de vantagem: Pena - deten\u00e7\u00e3o, de 2 (dois) meses a 1 (um) ano, ou multa, al\u00e9m da pena correspondente \u00e0 viol\u00eancia.&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&lt;span style=\&quot;color: rgb(161, 0, 0);\&quot;&gt;- Os bens s\u00e3o vendidos no estado que se encontram, cabendo ao interessado pesquisar e confirmar suas caracter\u00edsticas. As imagens s\u00e3o meramente ilustrativas e podem n\u00e3o representar a real situa\u00e7\u00e3o do lote.&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;&lt;br&gt;&lt;\/p&gt;&lt;p&gt;&lt;span style=\&quot;color: rgb(161, 0, 0);\&quot;&gt;Caso identificada ocorr\u00eancia t\u00e9cnica que impossibilite a devida finaliza\u00e7\u00e3o do leil\u00e3o, ser\u00e3o providenciadas as medidas de reparo necess\u00e1rias, ficando postergado o encerramento do procedimento para o dia \u00fatil subsequente, no mesmo hor\u00e1rio previsto. Todos os lances ofertados ser\u00e3o preservados, assim como as condi\u00e7\u00f5es e disposi\u00e7\u00f5es do edital.&lt;\/span&gt;&lt;\/p&gt;&quot;,&quot;contagem_visualizacoes&quot;:8902,&quot;titulo_lote&quot;:&quot;Casa - 299,00 m\u00b2 (a.c.) e 369,00 m\u00b2 (a.t.)&quot;,&quot;titulo_do_lote&quot;:&quot;Jardim Santo Amaro - S\u00e3o Paulo - SP&quot;,&quot;subtitulo_do_lote&quot;:&quot;Casa - 299,00 m\u00b2 (a.c.) e 369,00 m\u00b2 (a.t.)&quot;,&quot;leilao_id&quot;:1246,&quot;aceita_visitacao&quot;:0,&quot;status&quot;:&quot;INICIADO&quot;,&quot;ultimo_lance&quot;:null,&quot;porcentagem_minima_entrada&quot;:null,&quot;quantidade_maxima_parcelas&quot;:null,&quot;incremento_minimo_primeira_praca&quot;:&quot;120000.00&quot;,&quot;incremento_minimo_segunda_praca&quot;:&quot;120000.00&quot;,&quot;incremento_minimo_terceira_praca&quot;:null,&quot;localizacao_dos_bens&quot;:[{&quot;id&quot;:1603,&quot;cep&quot;:&quot;04.741-011&quot;,&quot;rua&quot;:&quot;Rua Darwin&quot;,&quot;pais&quot;:&quot;1&quot;,&quot;bair
