    <!-- LINK CURTO /r/CODIGO (23/08) — servido por rewrite para ESTE arquivo e desviado AQUI.
         O `vercel.json` manda `/r/:codigo` para `/index.html` (arquivo estático, que existe
         sempre) e o script abaixo troca para a rota da calculadora antes do app subir.
         Duas tentativas no servidor falharam em produção, ambas em silêncio: rewrite para
         função (api/r.js, depois api/redirecionar.js — a rota nunca existiu, o pedido caía
         neste index.html) e `redirects` declarativo no vercel.json (idem). Descartados por
         teste direto: teto de funções, runtime edge, nome do arquivo e o instrumento de
         medição — e as OUTRAS regras do vercel.json funcionam (a rota SEO /leiloes/:uf/:cidade
         responde do servidor). Por que a regra de /r/ apontada para uma FUNÇÃO não pega segue
         em aberto; apontada para este arquivo, pega.
         E o teste que fechou o diagnóstico: ao remover a regra, /r/ passou a devolver 404 —
         este projeto NÃO tem fallback de SPA para caminho desconhecido. Ou seja, sem a regra
         o script abaixo nunca rodaria, porque a página não chegaria a ser servida.
         `replace` para não deixar o /r/ no histórico (voltar levaria a um loop de redirect). -->
    <script>
      (function () {
        try {
          var m = location.pathname.match(/^\/r\/([A-Za-z0-9]{4,16})\/?$/);
          if (m) location.replace('/#/calculadora?ref=' + encodeURIComponent(m[1].toUpperCase()));
        } catch (e) { /* pathname exótico: segue para o app normalmente */ }
      })();
    </script>

    <!-- League Spartan (títulos) AUTO-HOSPEDADA (23/08) — some o FOUT de forma definitiva.
         O arquivo vem da NOSSA origem (rápido) e é PRECARREGADO, então em geral já pinta com
         a fonte da marca. E, mesmo na janela em que o fallback aparece, usa-se 'League Spartan
         Fallback': um Arial com size-adjust + overrides calculados das MÉTRICAS REAIS do
         arquivo (upm 2000, ascent 1400, descent -440, xWidthAvg 775 ponderado; base Arial),
         que ocupa o MESMO espaço. Resultado: a fonte pode trocar, mas o texto NÃO muda de
         tamanho (sem CLS/pulo). Variável: um único woff2 cobre 700–900. Inter (corpo) segue
         do Google com swap (métrica próxima do sistema, troca imperceptível). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/league-spartan-latin.woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'League Spartan';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/league-spartan-latin.woff2') format('woff2');
      }
      /* Fallback com MÉTRICAS CASADAS (base Arial) — evita o pulo enquanto a real carrega. */
      @font-face {
        font-family: 'League Spartan Fallback';
        src: local('Arial');
        size-adjust: 87.79%;
        ascent-override: 79.74%;
        descent-override: 25.06%;
        line-gap-override: 0%;
      }
    </style>
    <!-- Google tag (gtag.js). Guarda de hostname (18/08): os deploys de PREVIEW

         `gtag` continua definida em preview para os trackers serem no-ops inofensivos. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      if (/(^|\.)bidprobrasil\.com\.br$/.test(location.hostname)) {
        var _gs = document.createElement('script'); _gs.async = true;
        _gs.src = 'https://www.googletagmanager.com/gtag/js?id=G-5YNHQB5F81';
        document.head.appendChild(_gs);
        gtag('js', new Date());
        gtag('config', 'G-5YNHQB5F81');
        gtag('config', 'AW-16850175262');
      }
