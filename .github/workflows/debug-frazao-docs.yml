name: Debug estrutura de documentos do FRAZAO

# Sonda descartável: abre 3 lotes ativos do FRAZAO no navegador real e imprime a
# estrutura do DOM da seção "Documentos" + cada <a> de documento (cloudfront/cms).
# Só diagnostica, não grava nada. Manual.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Debug documentos FRAZAO
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/debug-frazao-docs.mjs
