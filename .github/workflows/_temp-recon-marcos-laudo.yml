name: TEMP recon — regerar relatório Marcos (galpão Feira de Santana)

on:
  workflow_dispatch:

jobs:
  regerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/epic-keller-t8mpce
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regerar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: https://tsn-app-git-claude-epic-kel-cdc7a7-tarcisio-nogueira-s-projects.vercel.app
        run: node scripts/_temp-recon-marcos-laudo.mjs
