name: Recon ALBERTOMACEDO API (temporário)

# Temporário (03/10): prova o caminho da API pública do site antes de mudar o coletor.
# Roda no push desta branch quando o script muda. Remover depois de integrar.
on:
  push:
    branches: [ 'claude/quirky-knuth-w4gr7a' ]
    paths:
      - 'scripts/recon-albertomacedo-api.mjs'
      - '.github/workflows/recon-albertomacedo-api.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Puppeteer
        run: npm i puppeteer@23 --no-save
      - name: Chromium deps
        run: npx puppeteer browsers install chrome
      - name: Recon
        run: node scripts/recon-albertomacedo-api.mjs
