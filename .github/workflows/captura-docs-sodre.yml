name: Documentos SODRE (público) — search-lots + páginas de lote

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos lotes por rodada'
        required: false
        default: '40'

concurrency:
  group: captura-docs-sodre
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Capturar documentos SODRE
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SD_LOTE: ${{ github.event.inputs.lote || '40' }}
        run: node scripts/captura-docs-sodre.mjs
