name: (Disposável) Regerar 1 relatório mercadológico
on:
  workflow_dispatch:
    inputs:
      imovel_id:
        description: 'UUID do imóvel (analises_mercado.imovel_id)'
        required: true

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regerar
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REGEN_IMOVEL_ID: ${{ github.event.inputs.imovel_id }}
        run: node scripts/_regen-imovel-mercado.mjs
