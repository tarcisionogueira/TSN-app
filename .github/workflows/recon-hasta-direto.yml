name: Recon — Hasta direto do runner (só leitura)
# 06/11: o Hasta abre do runner sem proxy pago? Nunca grava. Ver scripts/recon-hasta-direto.mjs.
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/recon-hasta-direto.mjs
