name: _temp-fetch-asaas-docs
on: { workflow_dispatch: {} }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Asaas API reference (anticipations) via public OpenAPI-ish endpoints
        run: |
          echo "=== docs.asaas.com/reference/criar-nova-antecipacao (rendered) ==="
          curl -sSL "https://docs.asaas.com/reference/criar-nova-antecipacao" | head -c 3000
          echo
          echo "=== tentando spec readme (se existir) ==="
          curl -sSL "https://docs.asaas.com/openapi.json" -o /tmp/openapi.json -w "HTTP %{http_code}\n" || true
          if [ -s /tmp/openapi.json ]; then
            echo "tamanho: $(wc -c < /tmp/openapi.json) bytes"
            node -e "
              const fs=require('fs');
              try {
                const spec=JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8'));
                const paths=Object.keys(spec.paths||{}).filter(p=>/anticipat/i.test(p));
                console.log('paths antecipacao:', paths);
                for (const p of paths) {
                  console.log('---', p, '---');
                  console.log(JSON.stringify(spec.paths[p], null, 2).slice(0, 4000));
                }
              } catch(e) { console.log('parse falhou:', e.message); }
            "
          fi
          echo "=== direct api.asaas.com (deve dar 401, só pra confirmar rota existe) ==="
          curl -sS -o /dev/null -w "POST /v3/anticipations -> HTTP %{http_code}\n" -X POST "https://api.asaas.com/v3/anticipations" -H "Content-Type: application/json" -d '{}'
          curl -sS -o /dev/null -w "GET /v3/anticipations/simulate -> HTTP %{http_code}\n" "https://api.asaas.com/v3/anticipations/simulate?payment=pay_test"
