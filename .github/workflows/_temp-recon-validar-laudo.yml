name: TEMP recon — validar leitura do laudo de avaliação

on:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/_temp-recon-validar-laudo.mjs
