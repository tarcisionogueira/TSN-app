name: Recon — a listagem da ZUK traz o acervo inteiro? (só leitura)

# 25/09: total declarado × cards carregados e os lotes desligados com 2ª praça futura (Chromium, grátis).
on:
  push:
    branches: [ 'claude/bidpro-brasil-registros-handoff-eulqvz' ]
    paths: [ 'scripts/recon-zuk-listagem.mjs', '.github/workflows/recon-zuk-listagem.yml' ]
  workflow_dispatch: {}

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - name: Dependências do Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - name: Recon
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/recon-zuk-listagem.mjs
