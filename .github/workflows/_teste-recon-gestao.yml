name: _teste recon gestao (temporario)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'url_lote a inspecionar'
        required: false
        default: 'https://lancenoleilao.com.br/lote.php?idLote=27293'
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: node scripts/_recon-gestao-doc.mjs "${{ github.event.inputs.url }}"
