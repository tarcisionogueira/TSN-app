name: Enriquecer Datas CEF (navegador)

# A data da Caixa é renderizada por JS — visitamos cada página no navegador
# (puppeteer) e lemos o texto renderizado. Roda no runner do GitHub, grátis.
# Processa um lote por execução (rotaciona por enriquecido_em); execuções
# diárias cobrem o acervo. Mesma técnica validada no ZUK (42 → 539).
on:
  schedule:
    # A cada 2h: a Caixa bloqueia o IP do runner após ~3 min/execução; cada run pega
    # um lote (IP novo a cada execução). Com a página mínima (domcontentloaded + corte
    # de analytics), cada run rende mais — 12 runs/dia cobrem o acervo mais rápido.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Máx. de imóveis por execução'
        required: false
        default: '4000'

# Garante que os runs NÃO se sobreponham (sem trabalho duplicado): um run em
# andamento termina antes do próximo começar (qualidade > quantidade bruta).
concurrency:
  group: enriquecer-datas-cef
  cancel-in-progress: false

jobs:
  enriquecer-cef:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Enriquecer datas CEF (navegador)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CEF_DATAS_LIMITE: ${{ github.event.inputs.limite || '4000' }}
        run: node scripts/enriquecer-datas-cef.mjs
