name: _temp-recon-cnj-agg
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Testa agregação (ranking de credores) no DataJud
        run: |
          curl -sS -L -X POST "https://www.bidprobrasil.com.br/api/temp-debug-cnj-agg?tribunal=tjsp" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "content-type: application/json" | tee /tmp/out.json
          echo "---"
          python3 -m json.tool /tmp/out.json || cat /tmp/out.json
