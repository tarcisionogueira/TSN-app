name: Scraper Ares (Picelli + Shiokawa, API PostgREST)

# Plataforma Ares (picellileiloes + shiokawaleiloes): catálogo por API PostgREST pública com a chave
# publishable do próprio site — sem navegador, custo Bright Data zero (recon 13/10). Cron GRAVA;
# dispatch manual também grava por default. Para ensaio, dispare com dryrun=1.
on:
  schedule:
    - cron: '10 9 * * *'  # diário, 9h10 UTC
  workflow_dispatch:
    inputs:
      dryrun:
        description: '1 = dry-run (não grava); 0 = grava'
        required: false
        default: '0'
      max_lotes:
        description: 'Máx. de lotes por execução'
        required: false
        default: '150'
      debug:
        description: '1 = log por página/lote'
        required: false
        default: '0'

jobs:
  scraper-ares:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Rodar scraper ARES
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ARES_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          ARES_MAX_LOTES: ${{ github.event.inputs.max_lotes || '150' }}
          ARES_DEBUG: ${{ github.event.inputs.debug || '0' }}
        run: node scripts/scraper-ares.mjs
