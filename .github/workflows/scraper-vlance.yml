name: Scraper VLANCE (Bright Data)

# A API Vlance (verdeamarelo / sudeste / capitalvalor — mesma API JSON) responde 403 em IP de
# datacenter (CI/Vercel) e a coleta client-side (navegador do staff) falha por CORS/site. Fallback
# autorizado pelo dono: RESIDENCIAL primeiro; se falhar, BRIGHT DATA. Este job é o Bright Data —
# server-side, confiável e verificável — para o VLANCE nunca ficar zerado.
# Agendado 1x/semana (segunda) + disparo manual.
# ⚠️ NÃO É FONTE GRÁTIS, ao contrário do que esta linha dizia até 29/08: `scraper_vlance.py`
# chama a Web Unlocker DIRETO (fora do ledger `brightdata_uso`, como o CLAUDE.md registra) —
# ou seja, o painel cobra por ele e o nosso teto semanal nem enxerga. Por isso desce para 1x,
# junto das demais fontes pagas.
on:
  schedule:
    - cron: '30 12 * * 1'   # 1x/semana (segunda), 12:30 UTC — após o scraper principal
  workflow_dispatch:
    inputs:
      dryrun:
        description: '1 = não grava (só lista); 0 = grava'
        required: false
        default: '0'

jobs:
  scraper-vlance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install requests
      - name: Rodar scraper VLANCE
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # CI = datacenter → o direto sempre dá 403; força Bright Data e não desperdiça tentativa.
          VLANCE_FORCE_BD: '1'
        run: |
          # FALLBACK: se o runner RESIDENCIAL do dono já atualizou o VLANCE nas últimas 48h,
          # pula e não gasta Bright Data. Só coleta quando o residencial não rodou (rede de segurança).
          if [ "${{ github.event.inputs.dryrun }}" = "1" ]; then
            python3 scripts/scraper_vlance.py --ignorar-robots
          else
            python3 scripts/scraper_vlance.py --supabase --ignorar-robots --pular-se-fresco 48
          fi
