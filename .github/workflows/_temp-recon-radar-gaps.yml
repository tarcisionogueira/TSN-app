name: _temp Recon Radar Gaps

on:
  workflow_dispatch:
    inputs:
      dominios:
        description: 'CSV de domínios a checar'
        required: false
        default: ''

jobs:
  recon-radar-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Recon radar gaps
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          RECON_DOMINIOS: ${{ inputs.dominios }}
        run: node scripts/recon-radar-gaps.mjs
