name: Explorar Frazão (diagnóstico)

# Garimpo diagnóstico do site do Frazão (não altera o banco): descobre se há API
# JSON rica, os data-* dos cards e os campos da página de detalhe (avaliação,
# área, ocupação, matrícula, edital). Roda sob demanda; leia o resultado no log.
on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Explorar Frazão
        run: node scripts/explorar-frazao.mjs
