# _temp — RECON da ficha do lote da NORDESTE (pendência #166). Só leitura, não grava nada.
# Existe porque o sandbox das sessões não tem egresso para nordesteleiloes.com.br. Apagar depois
# de diagnosticado (mesmo destino dos outros _temp-recon-*).
name: _temp Recon NORDESTE — ficha do lote de pátio

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs de lote separadas por vírgula (vazio = os alvos padrão do script)'
        required: false
        default: ''

jobs:
  recon-nordeste-ficha:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - name: Recon da ficha
        env:
          RECON_URLS: ${{ inputs.urls }}
        run: node scripts/recon-nordeste-ficha.mjs
