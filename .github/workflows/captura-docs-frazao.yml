name: Documentos FRAZAO (público) — Sale/LotDocs

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos lotes por rodada'
        required: false
        default: '60'

concurrency:
  group: captura-docs-frazao
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Capturar documentos FRAZAO
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FZ_LOTE: ${{ github.event.inputs.lote || '60' }}
        run: node scripts/captura-docs-frazao.mjs
