name: Recon — leilao/index veículos (não grava)

# Roda scripts/recon-leilaoindex-veiculos.mjs: confirma se `/leilao/index/veiculos`
# renderiza lotes de verdade (ou se, como aconteceu com `/leilao/index/imoveis`, o
# catálogo real só existe na home) para RIGOLONLEILOES/GIORDANOLEILOES/THAISTEIXEIRA,
# e mostra as primeiras linhas de texto de alguns detalhes. Só leitura.
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - name: Recon
        run: node scripts/recon-leilaoindex-veiculos.mjs
