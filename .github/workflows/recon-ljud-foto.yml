name: Recon LJUD Foto (a fonte tem a imagem que nos falta?)

on:
  workflow_dispatch:
    inputs:
      paginas:
        description: 'Paginas da API a varrer (mais paginas = mais lotes cruzados)'
        required: false
        default: '8'

jobs:
  recon-ljud-foto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Recon LJUD foto
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RECON_PAGINAS: ${{ inputs.paginas }}
        run: node scripts/recon-ljud-foto.mjs
