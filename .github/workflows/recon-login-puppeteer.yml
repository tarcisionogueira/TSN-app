name: Recon de login via navegador (SODRE/FRAZAO)

# Para leiloeiros que são apps JS: loga no navegador real, captura a rede (API/token/docs)
# e acha uma URL de lote válida. Só diagnostica. Manual.
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: 'SODRE ou FRAZAO'
        required: true

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Recon login navegador
        env:
          RLP_FONTE: ${{ github.event.inputs.fonte }}
          SODRE_EMAIL: ${{ secrets.SODRE_EMAIL }}
          SODRE_SENHA: ${{ secrets.SODRE_SENHA }}
          FRAZAO_EMAIL: ${{ secrets.FRAZAO_EMAIL }}
          FRAZAO_SENHA: ${{ secrets.FRAZAO_SENHA }}
          GL_EMAIL: ${{ secrets.GL_EMAIL }}
          GL_SENHA: ${{ secrets.GL_SENHA }}
        run: node scripts/recon-login-puppeteer.mjs
