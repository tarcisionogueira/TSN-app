name: _temp Recon CNJ retomada veículos

on:
  workflow_dispatch:

jobs:
  recon-cnj-retomada:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recon CNJ retomada veículos
        env:
          CNJ_DATAJUD_KEY: ${{ secrets.CNJ_DATAJUD_KEY }}
        run: node scripts/recon-cnj-retomada.mjs
