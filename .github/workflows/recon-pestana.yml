name: Recon PESTANA — de onde vem a data de leilão

# Descobre qual campo do objeto leilao/lote da Pestana carrega a data REAL do pregão
# (a fonte mostra 25/08, gravamos 26/10 em massa nos 1.031 lotes). Só diagnostica: NÃO grava
# nada. Manual. Ver scripts/recon-pestana-data.mjs e a trava fonte_data_leilao_uniforme.
on:
  # Dispara ao empurrar este workflow/script para a branch de trabalho (path-filtrado p/ não
  # re-rodar em push não relacionado). É como rodamos o recon "em produção" sem tocar em main.
  push:
    branches: [ 'claude/handoff-bidpro-brasil-checks-n0f1cv' ]
    paths:
      - 'scripts/recon-pestana-data.mjs'
      - '.github/workflows/recon-pestana.yml'
  workflow_dispatch:
    inputs:
      alvo:
        description: 'Trecho p/ achar o lote (matrícula ou valor). Ex.: 212.854 ou 329800'
        required: false
        default: '212.854'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Recon Pestana
        env:
          PESTANA_ALVO: ${{ github.event.inputs.alvo || '212.854' }}
        run: node scripts/recon-pestana-data.mjs
