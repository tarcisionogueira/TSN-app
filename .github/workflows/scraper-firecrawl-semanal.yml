name: Scraper Firecrawl (semanal) — LEJE + Fernando/Jonas/Lucas + Emílio Matos

# Fontes atrás de Cloudflare que só passam pelo Firecrawl (lib/motor/fetch-firecrawl.mjs), crédito
# pago: 1 por página. Dono, 10/10: "se consome créditos, 1x por semana". Custo medido por rodada:
# LEJE ~4 + MGL ~13 + Viva ~18 ≈ 35 créditos/semana. 15/10: Viva e Jinkings enumeram pelo feed
# /sitemap.xml (lib/degrau-feed.mjs) — mais lotes (Viva 40 imóveis abertos), ainda sob o mesmo teto. FIRECRAWL_MAX_PAGINAS é o teto por fonte e execução —
# estourado, a fonte grava 'sem_cota' (orçamento), não regressão.
# 22/10: plano GRÁTIS (1.000 créditos/mês, renova no período). Cada passo lê o saldo real da conta
# antes de gastar e usa só a sua fatia até a renovação (lib/motor/fetch-firecrawl.mjs) — o mês nunca
# passa do grátis, e o que parar por saldo volta sozinho no período seguinte.
on:
  schedule:
    - cron: '41 9 * * 1'   # segunda, 09:41 UTC (depois do scraper-dom das 8h)
  workflow_dispatch:
    inputs:
      fontes:
        description: 'csv: leje,mgl,emiliomatos'
        required: false
        default: 'leje,mgl'
      mgl_tenants:
        description: 'csv dos sites MGL (fernando,jonas,lucas,viva,jinkings) — vazio = todos'
        required: false
        default: ''
      gravar:
        description: '1 = grava no banco (default DRY-RUN; agendado sempre grava)'
        required: false
        default: '0'
      mgl_max:
        description: 'teto de lotes por site MGL nesta execução (vazio = 40) — dry-run barato: 3'
        required: false
        default: ''

jobs:
  firecrawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRYRUN_PADRAO: ${{ (github.event_name == 'schedule' || github.event.inputs.gravar == '1') && '0' || '1' }}
      FONTES: ${{ github.event.inputs.fontes || 'leje,mgl' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci

      - name: Leje
        if: ${{ !cancelled() && contains(env.FONTES, 'leje') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_MAX_PAGINAS: '40'
          LEJE_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-leje.mjs

      - name: MGL (Fernando, Jonas, Lucas, Viva, Jinkings)
        if: ${{ !cancelled() && contains(env.FONTES, 'mgl') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_MAX_PAGINAS: '60'
          MGL_DRYRUN: ${{ env.DRYRUN_PADRAO }}
          MGL_TENANTS: ${{ github.event.inputs.mgl_tenants }}
          MGL_MAX_LOTES: ${{ github.event.inputs.mgl_max || '40' }}
        run: node scripts/scraper-mgl.mjs

      # 21/10: VEÍCULOS do MGL (Fernando 351, Lucas ~14 — 0 no acervo). Mesmo parser, conversão em
      # lib/veiculo-do-lote.mjs. Teto de 55 detalhes/semana (~60 créditos), os novos primeiro.
      - name: MGL veículos (Fernando, Lucas)
        if: ${{ !cancelled() && contains(env.FONTES, 'mgl') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_MAX_PAGINAS: '60'
          # 22/10 (dono: sem custo novo): veículo é o ÚLTIMO da fila — reserva maior, só gasta o que
          # sobra do grátis depois dos imóveis. Saldo baixo = pula (sem_cota) e volta quando renovar.
          FIRECRAWL_RESERVA: '400'
          VEIC_FONTES: mgl
          VEIC_DRYRUN: ${{ env.DRYRUN_PADRAO }}
          VEIC_MAX_LOTES: '55'
        run: node scripts/scraper-veiculos-motor.mjs

      # 28/10: FORA DO AGENDADO (só por dispatch com fontes=...,emiliomatos). Os "eventos do leiloeiro" da home são
      # da REDE COLABORATIVA BomValor: o mesmo evento (ex. Imóveis STARS BANK 38451) aparece em todos os white-labels,
      # cada um carimbando o próprio nome. Os 42 lotes ativos eram os MESMOS ids/valores da GLOBOLEILOES (que já lê a
      # rede pelo mercado.bomvalor) — suprimidos como gemeo_entre_leiloeiros. ~45 créditos Firecrawl/semana por 0 lote único.
      # 18/10: religado SÓ com o acervo do leiloeiro (home → eventos de imóveis → /emilio-matos-rocha/imoveis/...).
      # O cron próprio (scraper-emiliomatos.yml) segue suspenso: ele lia o catálogo GLOBAL do Superbid.
      - name: Emílio Matos
        if: ${{ !cancelled() && contains(env.FONTES, 'emiliomatos') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_MAX_PAGINAS: '60'
          EMILIOMATOS_DRYRUN: ${{ env.DRYRUN_PADRAO }}
          EMILIOMATOS_MAX_LOTES: '55'
        run: node scripts/scraper-emiliomatos.mjs
