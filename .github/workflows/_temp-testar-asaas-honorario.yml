name: _temp Testar cobrança honorário via Asaas

on:
  workflow_dispatch:
    inputs:
      arrematacao_id:
        description: 'UUID da arrematação'
        required: true
      nome:
        description: 'Nome do pagador'
        required: true
      email:
        description: 'E-mail do pagador'
        required: true

jobs:
  testar-asaas-honorario:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar api/asaas (criar_cobranca_honorario_teste)
        run: |
          curl -sS -X POST "https://bidprobrasil.com.br/api/asaas" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"criar_cobranca_honorario_teste\",\"arrematacao_id\":\"${{ inputs.arrematacao_id }}\",\"nome\":\"${{ inputs.nome }}\",\"email\":\"${{ inputs.email }}\"}" \
            | tee resposta.json
          echo
          echo "=== LINK DE PAGAMENTO ==="
          node -e "const r=require('./resposta.json'); console.log(r.linkPagamento || JSON.stringify(r));"
