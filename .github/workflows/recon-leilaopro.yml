name: Recon LeilãoPro Core (leffa/oscar)

# Validação do parser de produção (lib/leilaopro-parse) sobre lotes VIVOS via Bright Data —
# imprime cada campo para conferência ANTES de liberar a grava no acervo. Só disparo manual.
# (Os recons exploratórios — estrutura, card/detalhe, preços — vivem em scripts/recon-leilaopro*.mjs
# e podem ser rodados à mão quando a fonte mudar; não rodam aqui para poupar cota Bright Data.)
on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'leffa | oscar'
        required: false
        default: 'leffa'
      max:
        description: 'máx. de lotes a validar'
        required: false
        default: '8'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DRY-RUN do parser de produção (valida campo-a-campo)
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          LEILAOPRO_TENANT: ${{ github.event.inputs.tenant }}
          LEILAOPRO_MAX: ${{ github.event.inputs.max }}
        run: node scripts/recon-leilaopro-parse.mjs
