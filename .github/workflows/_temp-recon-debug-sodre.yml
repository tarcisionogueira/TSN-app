name: _temp-recon-debug-sodre
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Chama o endpoint de diagnóstico SODRE
        run: |
          curl -sS -L -X POST "https://www.bidprobrasil.com.br/api/temp-debug-sodre?url=https%3A%2F%2Fleilao.sodresantoro.com.br%2Fleilao%2F29005%2Flotes-encerrados%2F2804970" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "content-type: application/json" | tee /tmp/out.json
          echo "---"
          python3 -m json.tool /tmp/out.json || cat /tmp/out.json
