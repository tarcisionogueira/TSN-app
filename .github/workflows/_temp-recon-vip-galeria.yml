name: _temp Recon galeria VIP (#183)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/recon-vip-galeria.mjs', '.github/workflows/_temp-recon-vip-galeria.yml']

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Puppeteer
        run: npm i puppeteer@23 --no-save
      - name: Chromium deps
        run: npx puppeteer browsers install chrome
      - name: Recon galeria VIP (não grava nada)
        run: node scripts/recon-vip-galeria.mjs
