name: Debug FRAZAO (clique) — estrutura da seção Documentos

on:
  workflow_dispatch:
    inputs:
      n:
        description: 'Quantos lotes'
        required: false
        default: '3'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Sonda FRAZAO clique
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FZ_N: ${{ github.event.inputs.n || '3' }}
        run: node scripts/debug-frazao-click.mjs
