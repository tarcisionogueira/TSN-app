name: Documentos Grupo Lance — captura completa (login)

# Loga no Grupo Lance (Yii) e captura TODOS os documentos por lote: Edital/Processo
# (público) + Matrícula/Auto de avaliação/Análise processual (gated). Preenche
# imoveis_leilao.anexos + link_matricula e sobe a matrícula no Storage.
# Backfill progressivo dos lotes que estão com 0 anexos.
on:
  schedule:
    - cron: '25 */6 * * *'   # 4x/dia, defasado dos outros jobs
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos lotes tentar nesta rodada'
        required: false
        default: '60'
      ids:
        description: 'fonte_id csv p/ teste (ex: gl_27183). Vazio = fila automática.'
        required: false
        default: ''

concurrency:
  group: captura-docs-grupolance
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Capturar documentos Grupo Lance → anexos + Storage
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GL_EMAIL: ${{ secrets.GL_EMAIL }}
          GL_SENHA: ${{ secrets.GL_SENHA }}
          ZUK_EMAIL: ${{ secrets.ZUK_EMAIL }}
          ZUK_SENHA: ${{ secrets.ZUK_SENHA }}
          GL_DOCS_LOTE: ${{ github.event.inputs.lote || '60' }}
          GL_DOCS_IDS: ${{ github.event.inputs.ids }}
        run: node scripts/captura-docs-grupolance.mjs
