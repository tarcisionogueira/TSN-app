name: Reabrir apuração de resultado de uma fonte (#44)
on:
  workflow_dispatch:
    inputs:
      fonte: { description: 'fonte (ex.: FRAZAO)', required: true }
      aplicar: { description: '1 = grava (padrão: em seco)', default: '0' }
      resultados: { description: '1 = refaz também vendido/sem_lance do leitor antigo', default: '0' }
jobs:
  reabrir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts
      - env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REABRIR_FONTE: ${{ inputs.fonte }}
          REABRIR_APLICAR: ${{ inputs.aplicar }}
          REABRIR_RESULTADOS: ${{ inputs.resultados }}
        run: node scripts/reabrir-apuracao-fonte.mjs
