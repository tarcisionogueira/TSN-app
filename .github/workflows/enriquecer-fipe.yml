name: Enriquecer FIPE (veículos)

# Valor FIPE de referência por veículo, via API pública gratuita (500 req/dia sem token).
# O lote vai até a cota diária acabar (trava atômica `registrar_uso_fipe`) — respostas ficam
# em `fipe_cache` por 25 dias e não gastam cota de novo. Ver scripts/enriquecer-fipe.mjs.
on:
  # 25/09 (dono): agendamento removido — o lote das 5h BRT comia 400 das 450 e a tela ficava com 50.
  # 13/10 (dono: filtrar a busca por FIPE — "invisto 34-40 mil, compro quanto de FIPE?"): com 33 de
  # 12 mil veículos com FIPE o filtro não tem o que filtrar. Volta TODA NOITE, com teto de 75% da cota (15/10, dono;
  # TETO_CRON_FIPE em api/_fipe.js): 25% fica sempre para a tela. 00h20 UTC = 21h20
  # BRT, logo após a virada do dia da cota (UTC) — a consulta do dono no dia seguinte já conta com
  # o cache do lote (mesmo modelo/ano não gasta cota de novo).
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Máx. de veículos por execução'
        required: false
        default: '600'

jobs:
  enriquecer-fipe:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # até a cota do dia acabar (~400 consultas); o cache no banco torna cada veículo mais lento que 1 req
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Enriquecer FIPE
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIPE_LIMITE: ${{ github.event.inputs.limite || '600' }}
          FIPE_TOKEN: ${{ secrets.FIPE_TOKEN }}
          FIPE_COTA_DIARIA: ${{ secrets.FIPE_COTA_DIARIA }}
        run: node scripts/enriquecer-fipe.mjs
