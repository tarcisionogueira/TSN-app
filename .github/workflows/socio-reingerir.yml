name: Sócio/IBGE — reingerir fonte (manual)

# Dispara /api/socio-ingestao-cron para uma FONTE específica, com o CRON_SECRET no header.
#
# POR QUE EXISTE (12/08): `cidade_socio.area_km2`, `domicilios`, `densidade_hab_km2` e
# `crescimento_pct` estão VAZIOS nas 5.571 linhas — e sem área não há como medir território
# mapeado. A causa não foi erro: as duas ingestões do Censo gravaram `ok=true`, 5.570 linhas e
# `rotulos_ignorados: []`, tendo trazido UMA de quatro colunas cada. O filtro de variáveis nos
# metadados é onde a ingestão emagrece, e emagrecia calada — o que não é PEDIDO nunca chega
# para ser ignorado.
#
# O cron diário só toca em fonte com mais de 25 dias (dado do IBGE é anual/decenal). Como os
# censos rodaram em 03 e 04/08, esperar o ciclo custaria semanas para ver o diagnóstico. Daí
# este disparo.
#
# O QUE LER NA RESPOSTA, em ordem:
#   · `colunas_faltando`      → quais colunas do `mapa` não vieram (vazio = ingestão completa)
#   · `variaveis_do_agregado` → os nomes que o IBGE REALMENTE expõe. É contra estas strings que
#                               os regex de `socio_fontes.mapa` precisam casar. Com esta lista o
#                               ajuste é leitura, não tentativa e erro.
#   · `ok`                    → agora sai FALSE em ingestão parcial, que é o ponto todo.
#
# Ajuste os regex com:
#   update socio_fontes set mapa = '{"<regex>": "<coluna>", ...}'::jsonb where chave = '<fonte>';
# e rode este workflow de novo.

on:
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Chave em socio_fontes (censo_populacao, censo_domicilios, estimativa_populacao, registro_civil_nascimentos). Ignorado se `metadados` for preenchido.'
        required: false
        default: 'censo_populacao'
      metadados:
        description: 'SONDA: número do agregado IBGE (ex.: 4714). Só LISTA as variáveis dele, não ingere nada. Use para achar onde mora área/densidade.'
        required: false
        default: ''
      buscar:
        description: 'BUSCA no catálogo do IBGE por termo (ex.: urbaniz). Lista os agregados cujo nome casa. Não ingere nada.'
        required: false
        default: ''
      base_url:
        description: 'Base URL do deploy'
        required: false
        default: 'https://bidprobrasil.com.br'

jobs:
  reingerir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar a ingestão
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET vazio — cadastre em Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -n "${{ github.event.inputs.buscar }}" ]; then
            URL="${{ github.event.inputs.base_url }}/api/socio-ingestao-cron?buscar=${{ github.event.inputs.buscar }}"
          elif [ -n "${{ github.event.inputs.metadados }}" ]; then
            URL="${{ github.event.inputs.base_url }}/api/socio-ingestao-cron?metadados=${{ github.event.inputs.metadados }}"
          else
            URL="${{ github.event.inputs.base_url }}/api/socio-ingestao-cron?fonte=${{ github.event.inputs.fonte }}"
          fi
          echo "GET $URL"
          CODE=$(curl -sSL --max-time 295 "$URL" -H "x-cron-secret: ${CRON_SECRET}" -o resp.json -w "%{http_code}")
          echo "HTTP $CODE"
          echo "--- resposta ---"
          python3 -m json.tool resp.json || cat resp.json
          # A ingestão responde 200 mesmo quando FALHA (`ok:false` no corpo) — é assim que o
          # cron diário evita que uma fonte quebrada derrube as outras. Sem o teste abaixo o
          # job saía VERDE por cima de `"erro":"fetch failed"`, que é exatamente o defeito que
          # o dia inteiro de 12/08 foi corrigir: resposta de erro entregue como sucesso.
          # Sonda (`metadados`/`buscar`) não ingere nada e não tem `ok` — não se aplica.
          if [ "$CODE" != "200" ]; then
            echo "::error::HTTP $CODE"
            exit 1
          fi
          if python3 -c "import json,sys; d=json.load(open('resp.json')); sys.exit(0 if d.get('ok') is not False else 1)"; then
            echo "ok"
          else
            echo "::error::A ingestão respondeu ok=false — veja 'erro'/'colunas_faltando'/'colisoes_de_rotulo' acima"
            exit 1
          fi

      # `cancelled()` junto com `failure()`: timeout não é failure para o GitHub, e sem isto a
      # execução cortada terminaria sem aviso (lição do scraper diário, 12/08).
      - name: Notify on failure
        if: failure() || cancelled()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -s -X POST "${APP_BASE_URL:-https://bidprobrasil.com.br}/api/notify-scraper" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"Socio/IBGE reingestao","etapa":"'"$JOB_STATUS"'","run_id":"'$GITHUB_RUN_ID'","run_url":"https://github.com/'$GITHUB_REPOSITORY'/actions/runs/'$GITHUB_RUN_ID'"}' || true
        continue-on-error: true
