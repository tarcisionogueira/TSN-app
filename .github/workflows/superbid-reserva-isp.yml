name: SUPERBID — apuração pelo proxy ISP (reserva do runner residencial)

# 25/09: SUPERBID/SOLD/KRON só são apurados pela offer-query do IP de casa (datacenter toma 403 do
# Cloudflare). Quando o runner não roda, os resultados ficam parados (115 veículos de 24/09).
# Esta reserva usa o MESMO script pelo proxy ISP (custo fixo, JSON pequeno). Seco por padrão;
# o agendamento só entra depois de o seco confirmar que o ISP passa (forma nº 10).
on:
  push:
    branches: [ 'claude/bidpro-brasil-registros-handoff-eulqvz' ]
    paths: [ '.github/workflows/superbid-reserva-isp.yml', 'scripts/apurar-superbid-residencial.mjs' ]
  workflow_dispatch:
    inputs:
      aplicar: { description: '1 = grava', default: '0' }
      limite: { description: 'Ofertas', default: '20' }

jobs:
  apurar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - name: Dependências do Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - name: Apurar via ISP
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_ISP_HOST: ${{ secrets.BRIGHTDATA_ISP_HOST }}
          BRIGHTDATA_ISP_USER: ${{ secrets.BRIGHTDATA_ISP_USER }}
          BRIGHTDATA_ISP_PASS: ${{ secrets.BRIGHTDATA_ISP_PASS }}
          SBID_VIA_ISP: '1'
          SBID_APLICAR: ${{ inputs.aplicar || '0' }}
          SBID_LIMITE: ${{ inputs.limite || '20' }}
        run: node scripts/apurar-superbid-residencial.mjs
