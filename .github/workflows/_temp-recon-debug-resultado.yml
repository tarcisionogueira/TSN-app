name: _temp-recon-debug-resultado
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Chama o endpoint de diagnóstico
        run: |
          curl -sS -L -X POST "https://www.bidprobrasil.com.br/api/temp-debug-resultado?ids=bd8a516d-e154-4410-99dd-faa26c16e47f,300d47f9-49a5-479f-b220-4470735e59e9,098a538f-894e-47e2-8366-a656fdcca935" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "content-type: application/json" | tee /tmp/out.json
          echo "---"
          python3 -m json.tool /tmp/out.json || cat /tmp/out.json
