name: Recon — Milan siteback (só leitura)
# 05/11: confere se a API pública siteback.milanleiloes.com.br abre a partir do servidor. Nunca grava.
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/recon-milan-siteback.mjs
