name: Documentos — captura genérica (navegador real)

on:
  schedule:
    - cron: '*/30 * * * *'   # a cada 30 min processa a fila pendente (economia; drena tudo por run)
  workflow_dispatch:

concurrency:
  group: captura-documentos
  cancel-in-progress: false

jobs:
  documentos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Capturar documentos (fila) → Storage + imovel_anexos
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 40/run (~13s por lote → ~9 min; teto seguro no timeout de 45 min). O */15
          # é throttled pelo GitHub p/ ~1-2h, então cada run precisa render mais.
          DOCS_LOTE: '40'
          # CAMINHO 3 (Bright Data Web Unlocker): desbloqueia leiloeiros anti-bot
          # (PECINI etc.) quando o Puppeteer é barrado. Sem estes segredos o caminho 3
          # simplesmente não roda (fallback seguro) — os caminhos 1/2 seguem normais.
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_MAX_REQ_SEMANA: ${{ secrets.BRIGHTDATA_MAX_REQ_SEMANA }}
          BRIGHTDATA_MAX_DOCS_SEMANA: ${{ secrets.BRIGHTDATA_MAX_DOCS_SEMANA }}
        run: node scripts/captura-documentos.mjs
