name: Scraper SATO

# SATO Leilões via API pública JSON (Round 35).
#
# ⛔ CRON SUSPENSO EM 10/09 — A URL DO LOTE É CONHECIDAMENTE INVÁLIDA (regressão)
#
# 02/08: `sato_lotes_com_url_inexistente.sql` provou que `/leilao/{id}` (o url_lote/link_edital
# que este arquivo grava) é um PALPITE nunca validado — 12/12 lotes sondados voltaram HTTP
# "Not Found". Os lotes foram desativados e a fonte saiu da fila de documentos até o padrão
# real de URL ser descoberto por recon ao vivo.
#
# 08/09: este workflow foi promovido a cron diário. A validação registrada foi "114 leilões
# enumerados, 24 prontos, zero erro" — só a LISTAGEM da API, nunca o padrão de URL do lote, que
# continuava exatamente o mesmo. O cron voltou a gravar `ativo=true` todo dia com o link morto.
#
# 10/09: achado de novo (revisão geral dos scrapers) — 27 lotes ativos com link 404 confirmado
# + 25 entradas na fila de documentos fadadas a falhar. Revertido (mesma migration de 02/08,
# arquivo `sato_url_invalida_regrediu_na_promocao_a_cron.sql`) e o `schedule` abaixo comentado
# de novo — desta vez com o motivo registrado aqui, não só no banco, para a PRÓXIMA promoção
# não repetir o mesmo engano: validar "a API responde" não é o mesmo que validar "o link do
# lote funciona", e foi exatamente essa segunda pergunta que faltou em 08/09.
#
# Para religar: (1) recon ao vivo confirmando o padrão real de URL do lote (não é possível
# deste sandbox — rede bloqueada até para leiloeiro); (2) corrigir `url_lote`/`link_edital` em
# scraper-sato.mjs; (3) `leiloeiro_conhecimento.docs_status` de volta para 'integrado'; (4)
# só então descomentar o `schedule` abaixo. `workflow_dispatch` continua disponível pro recon.
on:
  # schedule:
  #   - cron: '30 9 * * *'   # diário — depois do CEF (9h) e antes do leiloeiros-puppeteer (10h)
  workflow_dispatch:
    inputs:
      dryrun:
        description: '1 = dry-run (não grava); 0 = grava'
        required: false
        default: '1'
      max_pages:
        description: 'Máx. de páginas da API (15 leilões/página)'
        required: false
        default: '30'
      debug:
        description: '1 = log verboso (amostra de linhas)'
        required: false
        default: '0'

jobs:
  sato:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Agendado sempre grava; dispatch manual respeita o input (default dry-run) — mesmo
      # padrão de env.DRYRUN_PADRAO já usado em scraper-dom.yml (07/09), calculado uma vez
      # no nível do job pra não repetir a mesma expressão em cada step.
      DRYRUN_PADRAO: ${{ (github.event_name == 'schedule') && '0' || (github.event.inputs.dryrun || '1') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Scraper SATO
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SATO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
          SATO_MAX_PAGES: ${{ github.event.inputs.max_pages || '30' }}
          SATO_DEBUG: ${{ github.event.inputs.debug || '0' }}
        run: node scripts/scraper-sato.mjs

      # `cancelled()` junto com `failure()`: mesmo padrão dos outros crons (ver
      # leiloeiros-puppeteer.yml) — estourar o timeout não é `failure()` pro GitHub.
      - name: Notify on failure
        if: failure() || cancelled()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          JOB_STATUS: ${{ job.status }}
          MOTIVO: "${{ job.status == 'cancelled' && 'Timeout ou cancelamento no scraper SATO.' || 'Erro na execucao do scraper SATO.' }}"
        run: |
          curl -s -X POST "${APP_BASE_URL:-https://bidprobrasil.com.br}/api/notify-scraper" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"Scraper SATO","etapa":"'"$JOB_STATUS"'","mensagem":"'"$MOTIVO"'","run_id":"'$GITHUB_RUN_ID'","run_url":"https://github.com/'$GITHUB_REPOSITORY'/actions/runs/'$GITHUB_RUN_ID'"}' || true
        continue-on-error: true
