name: _temp Recon editais NAKAKOGUE (só leitura)

# 06/10: 4 lotes NAKAKOGUE sem cidade/UF. Procura os editais dos leilões e grava trechos em
# recon_dump. Não toca no acervo. Apagar depois.
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recon
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/recon-nakakogue-editais.mjs
