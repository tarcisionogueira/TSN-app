name: Auditoria amostral de datas (banco × site do leiloeiro)

# Amostra 1 a cada N lotes ativos por fonte e confere se a data de leilão que
# mostramos ao cliente existe na página VIVA do leiloeiro. Criada em 23/08 após
# o caso Ville de Lyon (SUPERBID, data ~1 mês divergente). Sob demanda — não é
# cron: o resultado orienta conserto de scraper, não substitui o monitor diário.
on:
  workflow_dispatch:
    inputs:
      passo:
        description: 'Amostra 1 a cada N lotes por fonte'
        required: false
        default: '20'
      forcar_ids:
        description: 'IDs (UUID) sempre incluídos, separados por vírgula'
        required: false
        default: ''
      oferta_sbid:
        description: 'DEBUG: id de oferta Superbid p/ despejar campos de data (pula a amostra)'
        required: false
        default: ''
      diag_fontes:
        description: 'DIAG: fontes sem data (ex.: GRUPOLANCE,BIASI) — página × extrator; pula a amostra'
        required: false
        default: ''

concurrency:
  group: auditoria-datas-amostral
  cancel-in-progress: false

jobs:
  # Debug pontual: com oferta_sbid preenchido, só despeja os campos de data da
  # oferta da Superbid (caso Ville de Lyon) — não roda a amostra.
  debug-superbid:
    if: ${{ github.event.inputs.oferta_sbid != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Despejar datas da oferta
        env:
          OFERTA_ID: ${{ github.event.inputs.oferta_sbid }}
        run: node scripts/debug-oferta-superbid.mjs

  # Diagnóstico das fontes que chegam SEM data ao cliente: a página publica data e
  # o extrator não lê, ou a página não publica? São consertos diferentes.
  diag-fontes-sem-data:
    if: ${{ github.event.inputs.diag_fontes != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Diagnosticar datas por fonte
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DIAG_FONTES: ${{ github.event.inputs.diag_fontes }}
        run: node scripts/diagnostico-datas-fontes.mjs

  auditar:
    if: ${{ github.event.inputs.oferta_sbid == '' && github.event.inputs.diag_fontes == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditar datas (amostral)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AMOSTRA_PASSO: ${{ github.event.inputs.passo || '20' }}
          FORCAR_IDS: ${{ github.event.inputs.forcar_ids || '' }}
        run: node scripts/auditoria-datas-amostral.mjs
