name: Recon leiloeiros novos (Pecini / WebLeilões)

# Explora os sites novos (pecinileiloes.com.br, webleiloes.com.br) para descobrir a
# estrutura da listagem de imóveis e as APIs JSON internas ANTES de escrever o
# scraper (recon-first). Só diagnostica; não grava nada. Manual.
on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites (csv): PECINI,WEBLEILOES'
        required: false
        default: 'PECINI,WEBLEILOES'
      dump_urls:
        description: 'URLs de detalhe pra dump de texto renderizado (csv, opcional)'
        required: false
        default: ''

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Recon
        env:
          RECON_SITES: ${{ github.event.inputs.sites || 'PECINI,WEBLEILOES' }}
          DUMP_URLS: ${{ github.event.inputs.dump_urls || '' }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # A Web Unlocker (fetchUnlockerContado/bd-ledger.mjs) checa cota via RPC no Supabase
          # ANTES de chamar o Bright Data de verdade — sem isto, TODA chamada falha com
          # "brightdata:cota_indisponivel — sem credencial do Supabase" mesmo com token/zone
          # certos (achado 07/09: JONASLEILOEIRO/FERNANDOLEILOEIRO via BD, 12/12 tentativas
          # falharam assim, nenhuma chegou a testar o unlocker de verdade).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/recon-novos-leiloeiros.mjs
