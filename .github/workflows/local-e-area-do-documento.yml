name: Local do pátio e área a partir do documento (custo zero)

# scripts/local-e-area-do-documento.mjs — lê edital/matrícula (CDN do leiloeiro e nosso bucket).
# Rodar primeiro EM SECO (aplicar=0) e conferir as amostras; depois aplicar=1.
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: '1 = grava; 0 = só mostra'
        default: '0'
      alvo:
        description: 'veiculos | imoveis | ambos'
        default: 'ambos'

jobs:
  documento:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Local e área do documento
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DOC_APLICAR: ${{ inputs.aplicar }}
          DOC_ALVO: ${{ inputs.alvo }}
        run: node scripts/local-e-area-do-documento.mjs
