name: Scraper PECINI (Bright Data)

# Parsing VALIDADO ao vivo (23 imóveis com valor/avaliação/foto em 2026-07-14).
# Cada lote = 1 request Bright Data (cota semanal com teto de custo em _brightdata.js).
# Cron modesto 2x/semana (seg e qui, 09h UTC) — prioriza lotes NOVOS e refresca os
# existentes, dentro do teto. Execução AGENDADA GRAVA (dryrun=0); dispatch manual pode
# passar dryrun=1 p/ testar. (Antes, o cron caía no fallback '1' e nunca gravava — por
# isso o Pecini ficou parado desde 14/07 apesar do cron existir.)
on:
  schedule:
    - cron: '0 9 * * 1'   # 1x/semana (seg), 9h UTC — fonte PAGA (Bright Data)
  workflow_dispatch:
    inputs:
      dryrun:
        description: '1 = não grava (só loga o que inseriria) · 0 = grava'
        required: false
        default: '0'
      max_lotes:
        description: 'Máx. de lotes por execução (cota Bright Data grátis)'
        required: false
        default: '40'
      debug:
        description: '1 = dumpa os contextos de R$ (recon dos rótulos)'
        required: false
        default: '0'
      debug_n:
        description: 'Quantos lotes SAUDÁVEIS dumpar (o dump de quem falhou é sempre)'
        required: false
        default: '3'
      # QUEM ESTE RUN VISITA (18/08). O padrão 'novos' é o comportamento de sempre e cai nos
      # antigos quando o sitemap não traz novidade. 'antigos' existe porque os lotes já
      # capturados só eram relidos por acaso — os da PECINI estavam parados desde julho, sem
      # a metragem e a matrícula que os consertos de 17/08 passaram a saber extrair.
      alvo:
        description: 'novos (padrão) · antigos (rele o já capturado, mais desatualizado primeiro) · todos'
        required: false
        default: 'novos'
        type: choice
        options: ['novos', 'antigos', 'todos']
      # TETO SEMANAL POR DISPARO, não fixo no arquivo (17/08). O freio de custo lê
      # BRIGHTDATA_MAX_REQ_SEMANA (padrão 450 em api/_brightdata.js) e este workflow NÃO
      # passava a variável — então todo run do runner usava 450, mesmo com saldo recarregado
      # no fornecedor. Recarregar no Bright Data não levanta o nosso teto: são freios
      # diferentes, e é de propósito. Fica como INPUT com o padrão de sempre para que subir o
      # teto seja um ato deliberado de quem dispara, com registro no histórico do run — e não
      # um número maior esquecido no arquivo, valendo para sempre e sem ninguém lembrar.
      teto_semana:
        description: 'Teto semanal de requests Bright Data (padrão 450). Subir = gasto maior.'
        required: false
        default: '450'

concurrency:
  group: scraper-pecini
  cancel-in-progress: false

jobs:
  pecini:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      # REDE DE SEGURANÇA (decisão do dono): este cron pago só roda se o runner
      # RESIDENCIAL (grátis) não coletou a fonte nos últimos 7 dias. Dispatch manual
      # ignora o freio (quem clica sabe o que quer).
      - name: Freio residencial (pula se coletado de casa há < 7 dias)
        id: freio
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/coleta-recente.mjs PECINI 7 >> "$GITHUB_OUTPUT"
      - name: Scraper Pecini
        if: github.event_name != 'schedule' || steps.freio.outputs.pular != '1'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          PECINI_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          PECINI_MAX_LOTES: ${{ github.event.inputs.max_lotes || '40' }}
          PECINI_DEBUG: ${{ github.event.inputs.debug || '0' }}
          PECINI_DEBUG_N: ${{ github.event.inputs.debug_n || '3' }}
          PECINI_ALVO: ${{ github.event.inputs.alvo || 'novos' }}
          BRIGHTDATA_MAX_REQ_SEMANA: ${{ github.event.inputs.teto_semana || '450' }}
        run: node scripts/scraper-pecini.mjs
