name: Scraper lojas Superbid (32 sites white-label, API pública)

# Lojas "Superbid Exchange" da junta (storeId do siteconfig de cada site). A maior parte dos imóveis já vem pelo portal
# SUPERBID; esta rodada mede cada loja e grava só a oferta que o portal ainda não trouxe. Custo zero (offer-query
# pública; recusa ao runner cai na via do banco). Roda DEPOIS da coleta do portal (que gravou ~14h UTC em 26/10),
# para gravar só o que ela não trouxe.
on:
  schedule:
    - cron: '40 15 * * *'  # diário, 15h40 UTC
  workflow_dispatch:
    inputs:
      dryrun:
        description: '1 = dry-run (não grava); 0 = grava'
        required: false
        default: '0'
      tenants:
        description: 'chaves separadas por vírgula (vazio = todas)'
        required: false
        default: ''

jobs:
  scraper-sbidloja:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Rodar scraper lojas Superbid
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SBIDLOJA_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          SBIDLOJA_TENANTS: ${{ github.event.inputs.tenants || '' }}
        run: node scripts/scraper-sbidloja.mjs
