name: TESTE MANUAL — screenshot do link de honorários

on:
  workflow_dispatch:
    inputs:
      arrematacao_id:
        description: 'id da arrematacao a testar'
        required: true

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - run: npx puppeteer browsers install chrome
      - name: Screenshot
        env:
          ARREMATACAO_ID: ${{ github.event.inputs.arrematacao_id }}
        run: node scripts/_screenshot-honorario.mjs
      - name: Commit screenshot (a Claude não alcança blob storage externo pelo proxy do sandbox)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv honorario.png scripts/_honorario-screenshot.png
          git add scripts/_honorario-screenshot.png
          git commit -m "test: screenshot temporario da tela de honorarios"
          git push origin HEAD:main
