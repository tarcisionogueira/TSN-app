name: Scraper — fontes de prazo curto (2ª coleta do dia)

# Pendência 504 (17/11). `fonte_perfil_publicacao()` mostrou que estas fontes publicam o lote poucos dias antes da
# praça: VIP com mediana de 3 dias, e os 10% mais curtos de VIP/ZUK/FRAZAO/LEILOTECH com 0–1 dia. Coletadas uma vez
# por dia (o diário grava entre 18h e 21h UTC), um lote publicado de manhã só aparecia para o cliente à noite — num
# prazo de 3 dias, isso é um terço da janela. Esta é a 2ª coleta, ~12 h depois da principal. Zero Bright Data (as
# quatro são grátis, puppeteer/fetch direto); custo = minutos do Actions (repositório público).
# A lista sai da classe 'curta' da função: revise com
#   select fonte, antec_p10, coleta_sugerida_h from fonte_perfil_publicacao(30) where classe_antecedencia = 'curta';
on:
  schedule:
    # 02:23 UTC (madrugada, fila do GitHub mais vazia). O agendamento do GitHub ATRASA muito: o diário marcado para
    # 10:00 UTC começou entre 16:27 e 20:08 em 13–16/11 (6 a 10 h depois). Marcado às 07:23, este cairia em cima dele;
    # às 02:23, mesmo com atraso parecido, roda de madrugada/manhã — longe da coleta principal.
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      fontes:
        description: 'Fontes (vazio = as de prazo curto)'
        required: false
        default: ''

# Uma fonte por job, em paralelo (17/11). O 1º teste rodou as quatro em fila num job de 60 min: VIP/ZUK/FRAZAO
# gravaram e a LEILOTECH (~1 min por tenant, 20+ tenants) foi cortada no meio. Em matriz, a lenta não derruba as
# outras e cada uma tem o seu veredito e o seu aviso de falha.
jobs:
  prazo-curto:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(matrix.fonte, 'LEILOTECH') && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        # Disparo manual com `fontes` preenchido = um job só com a lista inteira (SCRAPER_FONTES aceita vírgula).
        fonte: ${{ fromJSON(github.event.inputs.fontes && format('["{0}"]', github.event.inputs.fontes) || '["VIP","ZUK","FRAZAO","LEILOTECH"]') }}
    env:
      FONTES: ${{ matrix.fonte }}
    steps:
      - name: Marca o início do job
        run: echo "INICIO_JOB=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Coleta das fontes de prazo curto
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_FONTES: ${{ env.FONTES }}
        run: node scripts/scraper-puppeteer.mjs

      # Trava de fim de job (auditoria 17/11, item 5): verde só se alguma fonte coletou.
      - name: Alguma fonte coletou?
        if: ${{ !cancelled() }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/verificar-gravou.mjs "$INICIO_JOB" "$FONTES"

      - name: Notify on failure
        if: failure() || cancelled()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          JOB_STATUS: ${{ job.status }}
          MOTIVO: "${{ job.status == 'cancelled' && 'TIMEOUT ou cancelamento na coleta de prazo curto - confira o log.' || 'Erro na coleta de prazo curto.' }}"
        run: |
          curl -s -L --post301 --post302 --post303 -X POST "${APP_BASE_URL:-https://bidprobrasil.com.br}/api/notify-scraper" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"Scraper prazo curto ('"$FONTES"')","etapa":"'"$JOB_STATUS"'","mensagem":"'"$MOTIVO"'","run_id":"'$GITHUB_RUN_ID'","run_url":"https://github.com/'$GITHUB_REPOSITORY'/actions/runs/'$GITHUB_RUN_ID'"}' || true
        continue-on-error: true
