# _temp — passada única de ficha do VIP (#141). Apagar depois de rodada e conferida.
name: _temp Backfill VIP — ficha dos lotes fora da agenda

on:
  workflow_dispatch:
    inputs:
      seco:
        description: '1 = não grava'
        required: false
        default: '0'

jobs:
  backfill-vip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - name: Backfill VIP
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VIP_BACKFILL_SECO: ${{ inputs.seco }}
        run: node scripts/backfill-vip-ficha.mjs
