name: Scraper Diário de Leilões

on:
  schedule:
    - cron: '0 9 * * *'  # DIÁRIO, 9h UTC — CEF (CSV grátis, ~7 min/run). Era 2x/semana; leilões venciam antes do próximo scrape.
  workflow_dispatch:       # Permite rodar manualmente (e via botão do Admin → /api/trigger-scraper)
    inputs:
      ufs:
        description: 'Estados CEF (ex: SP,RJ,BA) — vazio = todos'
        required: false
        default: ''

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          UFS: ${{ github.event.inputs.ufs }}
        run: node scripts/scraper.js

      - name: Notify on failure
        if: failure()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          curl -s -X POST "${APP_BASE_URL:-https://bidprobrasil.com.br}/api/notify-scraper" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"Scraper Antigo","run_id":"'$GITHUB_RUN_ID'","run_url":"https://github.com/'$GITHUB_REPOSITORY'/actions/runs/'$GITHUB_RUN_ID'"}' || true
