name: Recon francoleiloes (Fernanda de Mello Franco)

on: { workflow_dispatch: {} }

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Recon francoleiloes
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # A Web Unlocker (fetchUnlockerContado/bd-ledger.mjs) checa cota via RPC no Supabase
          # ANTES de chamar o Bright Data de verdade — sem isto, TODA chamada falha com
          # "brightdata:cota_indisponivel — sem credencial do Supabase" mesmo com token/zone
          # certos (mesmo achado de 07/09 em recon-novos-leiloeiros.yml).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/recon-francoleiloes.mjs
