name: _temp-recon-contrato-longo
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Testa geração de contrato complexo (max_tokens 24000)
        run: |
          curl -sS -L -X POST "https://www.bidprobrasil.com.br/api/temp-debug-contrato-longo" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "content-type: application/json" \
            --max-time 290 | tee /tmp/out.json
          echo "---"
          python3 -m json.tool /tmp/out.json || cat /tmp/out.json
