name: Scraper Leiloar /externo/ (Sanches)

# Plataforma Leiloar /externo/: o leilão é o imóvel; avaliação e lance mínimo só no edital em PDF
# (lido com pdf-parse no runner). Sem Bright Data. Cron GRAVA; dispatch manual também grava por
# default. Para ensaio, dispare com dryrun=1.
on:
  schedule:
    - cron: '30 9 * * *'  # diário, 9h30 UTC
  workflow_dispatch:
    inputs:
      dryrun:
        description: '1 = dry-run (não grava); 0 = grava'
        required: false
        default: '0'
      max_lotes:
        description: 'Máx. de lotes por execução'
        required: false
        default: '60'
      debug:
        description: '1 = log por página/lote'
        required: false
        default: '0'

jobs:
  scraper-externo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Rodar scraper EXTERNO
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EXTERNO_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          EXTERNO_MAX_LOTES: ${{ github.event.inputs.max_lotes || '60' }}
          EXTERNO_DEBUG: ${{ github.event.inputs.debug || '0' }}
        run: node scripts/scraper-externo.mjs
