name: TESTE MANUAL — parcelas do link de honorários

on:
  workflow_dispatch:
    inputs:
      arrematacao_id:
        description: 'id da arrematacao a testar'
        required: true

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - run: npx puppeteer browsers install chrome
      - name: Testar parcelas
        env:
          ARREMATACAO_ID: ${{ github.event.inputs.arrematacao_id }}
        run: node scripts/_teste-parcelas-honorario.mjs
