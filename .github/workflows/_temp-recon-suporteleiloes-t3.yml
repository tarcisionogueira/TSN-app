name: _temp Recon Suporte Leilões template 3 (leilaobrasil/luthero)

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recon
        run: node scripts/_recon-suporteleiloes-template3.mjs
