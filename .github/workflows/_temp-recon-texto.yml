# _temp — RECON genérico de texto de página (só leitura). Apagar quando não houver uso.
name: _temp Recon texto de página

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs separadas por vírgula'
        required: true
      padrao:
        description: 'regex a procurar no innerText'
        required: false
        default: '\d{2}/\d{2}/\d{4}'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - name: Recon
        env:
          RECON_URLS: ${{ inputs.urls }}
          RECON_PADRAO: ${{ inputs.padrao }}
        run: node scripts/recon-texto-pagina.mjs
