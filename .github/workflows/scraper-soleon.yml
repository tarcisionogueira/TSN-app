name: Scraper SOLEON (multi-tenant)

# Cluster SOLEON (calil, vegas, 3torres…) — mesma plataforma white-label do RJ Leilões,
# cujo parser já é validado. calil/vegas NÃO estão atrás de Cloudflare (fetch grátis);
# só o 3torres cai no Bright Data. Fluxo recon-first: DEBUG → dry-run → gravação.
# No cron GRAVA; no dispatch manual é dry-run por padrão (dryrun=0 p/ gravar).
on:
  schedule:
    - cron: '30 10 * * 1'   # 1x/semana (segunda), 10:30 UTC
  workflow_dispatch:
    inputs:
      forcar:
        # 29/08 — POR QUE ESTE INPUT EXISTE, e por que o freio deixou de ignorar o dispatch:
        # o `if` deste job era `github.event_name != 'schedule' || pular != '1'`, escrito quando
        # dispatch significava "um humano clicou". Desde que `api/coleta-oportunista.js` passou a
        # disparar estes workflows sempre que o staff abre o app (espacamento de 20h), dispatch
        # virou um evento AUTOMATICO DIARIO — e a condicao antiga fazia o freio de custo nao valer
        # justamente no caminho que mais roda. Medido: os 4 workflows pagos rodaram por dispatch
        # TODOS OS DIAS de 08/08 a 29/08, e em 29/08 dispararam as 10:29 UTC (todos `sem_cota`)
        # sobre as MESMAS fontes que o runner residencial coletou de graca as 13:02.
        # Agora o freio vale para schedule E para o disparo oportunista; quem clica de proposito
        # e quer pagar mesmo com acervo fresco passa forcar=1.
        description: '1 = ignora o freio de frescor (paga Bright Data mesmo com acervo fresco)'
        required: false
        default: '0'
      debug:
        description: '1 = RECON (dumpa listagem + 1 detalhe por tenant)'
        required: false
        default: '0'
      dryrun:
        description: '1 = dry-run (não grava); 0 = grava'
        required: false
        default: '1'
      max_lotes:
        description: 'Máx. de lotes NOVOS por tenant/execução'
        required: false
        default: '60'
      tenants:
        description: 'csv de fontes (vazio = todos). Ex.: CALIL,VEGAS'
        required: false
        default: ''

jobs:
  scraper-soleon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      # REDE DE SEGURANÇA (decisão do dono): este cron pago só roda se o runner
      # RESIDENCIAL (grátis) não coletou a fonte nos últimos 7 dias.
      # ⚠️ O freio vale para o cron E para o disparo oportunista (dispatch sem inputs).
      # Só `forcar=1` passa por cima — ver o comentário do input, com a medição de 29/08.
      - name: Freio residencial (pula se coletado de casa há < 7 dias)
        id: freio
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/coleta-recente.mjs SOLEON 7 >> "$GITHUB_OUTPUT"
      - name: Rodar scraper SOLEON
        if: github.event.inputs.forcar == '1' || steps.freio.outputs.pular != '1'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_MAX_REQ_SEMANA: ${{ secrets.BRIGHTDATA_MAX_REQ_SEMANA }}
          SOLEON_DEBUG: ${{ github.event.inputs.debug || '0' }}
          SOLEON_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          SOLEON_MAX_LOTES: ${{ github.event.inputs.max_lotes || '60' }}
          SOLEON_TENANTS: ${{ github.event.inputs.tenants || '' }}
        run: node scripts/scraper-soleon.mjs
