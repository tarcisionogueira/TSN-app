name: _temp Vlance novos tenants (dry-run)

on:
  workflow_dispatch:
    inputs:
      gravar:
        description: '1 = grava de verdade em produção (fonte VLANCE); 0 = só lista (dry-run)'
        required: false
        default: '0'

jobs:
  vlance-novos-tenants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install requests
      - name: Dry-run só joserodovalho + hdleiloes
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          VLANCE_FORCE_BD: '1'
        run: |
          if [ "${{ inputs.gravar }}" = "1" ]; then
            python3 scripts/scraper_vlance.py --dominios joserodovalholeiloes.com.br,hdleiloes.com.br --supabase --ignorar-robots
          else
            python3 scripts/scraper_vlance.py --dominios joserodovalholeiloes.com.br,hdleiloes.com.br --ignorar-robots
          fi
