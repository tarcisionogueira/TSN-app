name: _temp Vlance novos tenants (dry-run)

on:
  workflow_dispatch:

jobs:
  vlance-novos-tenants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install requests
      - name: Dry-run só joserodovalho + hdleiloes
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          VLANCE_FORCE_BD: '1'
        run: python3 scripts/scraper_vlance.py --dominios joserodovalholeiloes.com.br,hdleiloes.com.br --todas --ignorar-robots
