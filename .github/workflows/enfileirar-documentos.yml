name: Enfileirar documentos (matrícula faltante + arquivamento de fontes instáveis)

# Contramedida para a lacuna de matrículas: chama a função enfileirar_docs_faltantes(),
# que põe na documentos_fila os imóveis públicos ativos sem matrícula (com url_lote). O
# job "Documentos — captura genérica" (a cada 15 min) drena a fila -> Storage/imovel_anexos.
# Diário às 10 UTC (antes do backfill de docs das 11:30) + manual.
on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Máximo a enfileirar por execução'
        required: false
        default: '3000'
  schedule:
    - cron: '0 10 * * *'

jobs:
  enfileirar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar RPC enfileirar_docs_faltantes
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LIMITE: ${{ github.event.inputs.limite || '3000' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then echo "::error::secrets ausentes"; exit 1; fi
          echo "Enfileirando MATRÍCULA faltante (limite $LIMITE)…"
          curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/enfileirar_docs_faltantes" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_limite\": $LIMITE}" -w "\nHTTP %{http_code}\n"

      - name: Chamar RPC enfileirar_docs_arquivar (todos os leiloeiros)
        # Arquivamento proativo: guarda no bucket o PDF de imóveis de TODA fonte de leilão
        # (flag leiloeiro_conhecimento.arquivar_docs, ligada p/ todos + default true nos
        # futuros) enquanto o link ainda está vivo. Fonte gratuita resolve pelo fetch
        # direto (grátis); Bright Data só quando o navegador é bloqueado. O mesmo job de
        # captura genérica drena a fila. CEF e fontes docs_status='esperado' ficam de fora
        # (guardas no RPC: pipeline próprio / a fonte não publica o documento).
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then echo "::error::secrets ausentes"; exit 1; fi
          echo "Enfileirando ARQUIVAMENTO de fontes instáveis (limite 1000)…"
          curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/enfileirar_docs_arquivar" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_limite\": 1000}" -w "\nHTTP %{http_code}\n"
