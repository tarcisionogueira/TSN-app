name: _temp-recon-debug-sodre2
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Investiga NUXT_DATA completo + API direta SODRE
        run: |
          curl -sS -L -X POST "https://www.bidprobrasil.com.br/api/temp-debug-sodre2?url=https%3A%2F%2Fvenda-imoveis.caixa.gov.br%2Fsistema%2Fdetalhe-imovel.asp%3Fhdnimovel%3D10003047" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "content-type: application/json" | tee /tmp/out.json
          echo "---"
          python3 -m json.tool /tmp/out.json || cat /tmp/out.json
