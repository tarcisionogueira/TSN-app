name: TEMP recon — regerar relatório Gênesis II

on:
  workflow_dispatch:

jobs:
  regerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regerar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/_temp-recon-regerar-genesis2.mjs
