name: Limpar espelho de documentos (expirados + cópias idênticas)

# scripts/limpar-espelho.mjs — mesma regra que o limpar-documentos-cron roda todo dia; este
# workflow existe para a faxina do acumulado. EM SECO por padrão (caixa desmarcada).
on:
  workflow_dispatch:
    inputs:
      # Caixa de marcar, não texto: com um campo "0/1" o valor padrão 0 passava despercebido e a
      # faxina rodou em seco duas vezes achando que apagava (24/09).
      apagar:
        description: 'Marque para APAGAR de verdade (desmarcado = só mostra)'
        type: boolean
        default: false

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Limpar espelho
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ESPELHO_APLICAR: ${{ inputs.apagar && '1' || '0' }}
        run: node scripts/limpar-espelho.mjs
