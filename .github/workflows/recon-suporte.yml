name: Recon SUPORTE (white-label, grátis)

on: { workflow_dispatch: { inputs: { doms: { description: 'csv de domínios', required: false, default: '' } } } }

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - name: Recon SUPORTE
        env:
          SUPORTE_DOMS: ${{ github.event.inputs.doms }}
        run: node scripts/recon-suporte.mjs
