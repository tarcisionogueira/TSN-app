name: TEMP recon — regerar Gênesis II e Vila Mariana (produção)

on:
  workflow_dispatch:

jobs:
  regerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regerar Gênesis II
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/_temp-recon-regerar-genesis2-b.mjs
      - name: Regerar Vila Mariana
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/_temp-recon-regerar-vila-mariana-3.mjs
