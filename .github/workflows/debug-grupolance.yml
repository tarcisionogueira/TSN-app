name: Debug Grupo Lance — matrícula pública?

# Recon (sem login): descobre se a matrícula do Grupo Lance é pública (CDN/página)
# ou login-gated. Só diagnostica, não grava. Manual.
on:
  workflow_dispatch:
    inputs:
      n:
        description: 'Quantos lotes sondar'
        required: false
        default: '10'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Sondar matrícula do Grupo Lance
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GL_DEBUG_N: ${{ github.event.inputs.n || '10' }}
        run: node scripts/debug-grupolance-docs.mjs
