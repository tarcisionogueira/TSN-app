name: Recon — rotas 404 em produção (não grava)

# Roda scripts/recon-rotas-404.mjs: testa se rotas client-side (SPA) dão 404 direto
# da Vercel (falta de rewrite catch-all pra index.html) ou é algo específico.
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recon
        run: node scripts/recon-rotas-404.mjs
