name: Scraper DOM (Passo 2) — alfa/hasta/nordeste

# Fontes `dom` do motor fetch × parse (Puppeteer no runner, 0 Bright Data). O push na
# branch de trabalho roda alfa+nordeste em DRY-RUN (validação do Passo 2 — não grava).
# HASTA NÃO roda no push: o site bloqueia IP de datacenter, então daqui ele SEMPRE
# falha — e o DRY-RUN grava fonte_saude 'falhou/0', ruído que engana o monitor de
# baseline (aconteceu em 21/08 19:27 UTC, no meio da 1ª carga residencial de verdade).
# HASTA é do runner RESIDENCIAL; no dispatch manual segue disponível para quem pedir.
# Para GRAVAR: dispatch com gravar=1 (só depois do merge/decisão do dono).
on:
  push:
    # PADRÃO, não nome fixo (31/08). Estava travado em
    # `claude/handoff-bidpro-brasil-verificacoes-7h3pat` — uma branch de sessão que já não
    # existe. Um gatilho apontando para branch morta não dá erro: o workflow simplesmente
    # nunca roda, e a validação do Passo 2 some sem ninguém notar (ALFA e NORDESTE ficaram
    # 10 dias sem UMA medição, e quem acusou foi `fonte_regressao_suspeita`, não o CI).
    # Nome de branch de sessão é efêmero por definição; o padrão sobrevive à próxima.
    branches: [ 'claude/**' ]
    paths:
      - 'scripts/lib/motor/**'
      - 'scripts/lib/alfa-parse.mjs'
      - 'scripts/lib/hasta-parse.mjs'
      - 'scripts/lib/nordeste-parse.mjs'
      - 'scripts/lib/jeleiloes-parse.mjs'
      - 'scripts/lib/leilaoindex-parse.mjs'
      - 'scripts/lib/rocha-parse.mjs'
      - 'scripts/lib/albertomacedo-parse.mjs'
      - 'scripts/lib/simon-parse.mjs'
      - 'scripts/lib/globo-parse.mjs'
      - 'scripts/lib/leje-parse.mjs'
      - 'scripts/lib/dom-parse-util.mjs'
      - 'scripts/scraper-alfa.mjs'
      - 'scripts/scraper-hasta.mjs'
      - 'scripts/scraper-nordeste.mjs'
      - 'scripts/scraper-jeleiloes.mjs'
      - 'scripts/scraper-leilaoindex.mjs'
      - 'scripts/scraper-rocha.mjs'
      - 'scripts/scraper-albertomacedo.mjs'
      - 'scripts/scraper-simon.mjs'
      - 'scripts/scraper-globo.mjs'
      - 'scripts/scraper-leje.mjs'
      - '.github/workflows/scraper-dom.yml'
  workflow_dispatch:
    inputs:
      fontes:
        description: 'csv: alfa,hasta,nordeste,jeleiloes,leilaoindex,rocha,albertomacedo,simon,globo,leje (hasta so funciona de IP residencial — de datacenter falha sempre)'
        required: false
        default: 'alfa,nordeste'
      gravar:
        description: '1 = grava no banco (default DRY-RUN)'
        required: false
        default: '0'

jobs:
  scraper-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Alfa
        if: ${{ github.event_name == 'push' || contains(github.event.inputs.fontes, 'alfa') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALFA_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-alfa.mjs

      - name: Hasta
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && contains(github.event.inputs.fontes, 'hasta') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HASTA_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-hasta.mjs

      - name: Nordeste
        if: ${{ !cancelled() && (github.event_name == 'push' || contains(github.event.inputs.fontes, 'nordeste')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NORDESTE_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-nordeste.mjs

      - name: Jeleiloes
        if: ${{ !cancelled() && (github.event_name == 'push' || contains(github.event.inputs.fontes, 'jeleiloes')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JELEILOES_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-jeleiloes.mjs

      - name: Leilaoindex
        if: ${{ !cancelled() && (github.event_name == 'push' || contains(github.event.inputs.fontes, 'leilaoindex')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEILAOINDEX_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-leilaoindex.mjs

      - name: Rocha
        if: ${{ !cancelled() && (github.event_name == 'push' || contains(github.event.inputs.fontes, 'rocha')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ROCHA_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-rocha.mjs

      - name: Albertomacedo
        if: ${{ !cancelled() && (github.event_name == 'push' || contains(github.event.inputs.fontes, 'albertomacedo')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALBERTOMACEDO_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-albertomacedo.mjs

      - name: Simon
        if: ${{ !cancelled() && (github.event_name == 'push' || contains(github.event.inputs.fontes, 'simon')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SIMON_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-simon.mjs

      - name: Globo
        if: ${{ !cancelled() && (github.event_name == 'push' || contains(github.event.inputs.fontes, 'globo')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GLOBO_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-globo.mjs

      - name: Leje
        if: ${{ !cancelled() && (github.event_name == 'push' || contains(github.event.inputs.fontes, 'leje')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEJE_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-leje.mjs
