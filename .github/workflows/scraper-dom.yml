name: Scraper DOM (Passo 2) — alfa/hasta/nordeste + candidatos DJEN

# Fontes `dom` do motor fetch × parse (Puppeteer no runner, 0 Bright Data). O push na
# branch de trabalho roda TODAS as fontes (exceto HASTA) em DRY-RUN (validação — não
# grava). HASTA NÃO roda no push nem no agendamento: o site bloqueia IP de datacenter,
# então daqui ele SEMPRE falha — e gravar fonte_saude 'falhou/0' é ruído que engana o
# monitor de baseline (aconteceu em 21/08 19:27 UTC, no meio da 1ª carga residencial de
# verdade). HASTA é do runner RESIDENCIAL; segue disponível só no dispatch manual.
#
# PRODUÇÃO (07/09): `schedule` abaixo GRAVA de verdade, sozinho, todo dia — sem isto,
# nenhuma destas fontes escrevia no banco a não ser por dispatch manual (alguém lembrar
# de clicar com gravar=1). `env.DRYRUN_PADRAO`/`env.RODA_TUDO` no nível do job calculam a regra
# UMA VEZ (schedule OU dispatch com gravar=1 → grava; push → sempre dry-run) — cada fonte
# só referencia `env.*`, pra não repetir a mesma expressão 9x e arriscar errar uma.
on:
  schedule:
    - cron: '0 8 * * *'  # diário, 8h UTC (antes do scraper.yml/CEF às 9h — sem disputar runner)
  push:
    # PADRÃO, não nome fixo (31/08). Estava travado em
    # `claude/handoff-bidpro-brasil-verificacoes-7h3pat` — uma branch de sessão que já não
    # existe. Um gatilho apontando para branch morta não dá erro: o workflow simplesmente
    # nunca roda, e a validação do Passo 2 some sem ninguém notar (ALFA e NORDESTE ficaram
    # 10 dias sem UMA medição, e quem acusou foi `fonte_regressao_suspeita`, não o CI).
    # Nome de branch de sessão é efêmero por definição; o padrão sobrevive à próxima.
    branches: [ 'claude/**' ]
    paths:
      - 'scripts/lib/motor/**'
      - 'scripts/lib/alfa-parse.mjs'
      - 'scripts/lib/hasta-parse.mjs'
      - 'scripts/lib/nordeste-parse.mjs'
      - 'scripts/lib/jeleiloes-parse.mjs'
      - 'scripts/lib/leilaoindex-parse.mjs'
      - 'scripts/lib/rocha-parse.mjs'
      - 'scripts/lib/albertomacedo-parse.mjs'
      - 'scripts/lib/simon-parse.mjs'
      - 'scripts/lib/globo-parse.mjs'
      - 'scripts/lib/leje-parse.mjs'
      - 'scripts/lib/dom-parse-util.mjs'
      - 'scripts/scraper-alfa.mjs'
      - 'scripts/scraper-hasta.mjs'
      - 'scripts/scraper-nordeste.mjs'
      - 'scripts/scraper-jeleiloes.mjs'
      - 'scripts/scraper-leilaoindex.mjs'
      - 'scripts/scraper-rocha.mjs'
      - 'scripts/scraper-albertomacedo.mjs'
      - 'scripts/scraper-simon.mjs'
      - 'scripts/scraper-globo.mjs'
      - 'scripts/scraper-leje.mjs'
      - '.github/workflows/scraper-dom.yml'
  workflow_dispatch:
    inputs:
      fontes:
        description: 'csv: alfa,hasta,nordeste,jeleiloes,leilaoindex,rocha,albertomacedo,simon,globo,leje (hasta so funciona de IP residencial — de datacenter falha sempre)'
        required: false
        default: 'alfa,nordeste'
      gravar:
        description: '1 = grava no banco (default DRY-RUN; agendado sempre grava)'
        required: false
        default: '0'

jobs:
  scraper-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Nome pelo EFEITO no _DRYRUN de cada fonte (1=dry-run, 0=grava) — não pelo gatilho.
      # (achado 07/09, revisão externa: "GRAVA" antes chamava 1 de "grava", exatamente o
      # oposto do que o valor faz — funcionava certo, só confundia quem lesse depois.)
      DRYRUN_PADRAO: ${{ (github.event_name == 'schedule' || github.event.inputs.gravar == '1') && '0' || '1' }}
      RODA_TUDO: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Alfa
        if: ${{ env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'alfa') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALFA_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-alfa.mjs

      - name: Hasta
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && contains(github.event.inputs.fontes, 'hasta') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HASTA_DRYRUN: ${{ github.event.inputs.gravar == '1' && '0' || '1' }}
        run: node scripts/scraper-hasta.mjs

      - name: Nordeste
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'nordeste')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NORDESTE_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-nordeste.mjs

      - name: Jeleiloes
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'jeleiloes')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JELEILOES_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-jeleiloes.mjs

      - name: Leilaoindex
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'leilaoindex')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEILAOINDEX_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-leilaoindex.mjs

      - name: Rocha
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'rocha')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ROCHA_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-rocha.mjs

      - name: Albertomacedo
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'albertomacedo')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALBERTOMACEDO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-albertomacedo.mjs

      - name: Simon
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'simon')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SIMON_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-simon.mjs

      - name: Globo
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'globo')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GLOBO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-globo.mjs

      - name: Leje
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'leje')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEJE_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-leje.mjs

      - name: Notify on failure
        # `cancelled()` também: estourar o timeout-minutes não é `failure()` pro GitHub, e sem
        # isto uma rodada agendada cortada no meio termina sem aviso nenhum (mesma lição já
        # documentada em scraper.yml/CEF — silêncio de 3 dias de coleta truncada).
        if: ${{ github.event_name == 'schedule' && (failure() || cancelled()) }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -s -X POST "${APP_BASE_URL:-https://bidprobrasil.com.br}/api/notify-scraper" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"Scraper DOM","etapa":"'"$JOB_STATUS"'","run_id":"'$GITHUB_RUN_ID'","run_url":"https://github.com/'$GITHUB_REPOSITORY'/actions/runs/'$GITHUB_RUN_ID'"}' || true
        continue-on-error: true
