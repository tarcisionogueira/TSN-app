name: Scraper DOM (Passo 2) — alfa/hasta/nordeste + candidatos DJEN

# Fontes `dom` do motor fetch × parse (Puppeteer no runner, 0 Bright Data — exceto HASTA,
# que usa o proxy ISP do Bright Data, custo fixo). O push na branch de trabalho roda TODAS
# as fontes (exceto HASTA) em DRY-RUN (validação — não grava). HASTA agora entra no
# RODA_TUDO (agendado/push) como as demais (19/09): até aqui ficava de fora porque o site
# bloqueava IP de datacenter e SEMPRE falhava daqui — `dom.usarProxyIsp` em
# lib/motor/fontes/hasta.mjs resolve isso (validado em 3 rodadas de recon, 19/09). Segue
# disponível também no dispatch manual, sem precisar estar na lista de `fontes`.
#
# PRODUÇÃO (07/09): `schedule` abaixo GRAVA de verdade, sozinho, todo dia — sem isto,
# nenhuma destas fontes escrevia no banco a não ser por dispatch manual (alguém lembrar
# de clicar com gravar=1). `env.DRYRUN_PADRAO`/`env.RODA_TUDO` no nível do job calculam a regra
# UMA VEZ (schedule OU dispatch com gravar=1 → grava; push → sempre dry-run) — cada fonte
# só referencia `env.*`, pra não repetir a mesma expressão 9x e arriscar errar uma.
on:
  schedule:
    - cron: '0 8 * * *'  # diário, 8h UTC (antes do scraper.yml/CEF às 9h — sem disputar runner)
  push:
    # PADRÃO, não nome fixo (31/08). Estava travado em
    # `claude/handoff-bidpro-brasil-verificacoes-7h3pat` — uma branch de sessão que já não
    # existe. Um gatilho apontando para branch morta não dá erro: o workflow simplesmente
    # nunca roda, e a validação do Passo 2 some sem ninguém notar (ALFA e NORDESTE ficaram
    # 10 dias sem UMA medição, e quem acusou foi `fonte_regressao_suspeita`, não o CI).
    # Nome de branch de sessão é efêmero por definição; o padrão sobrevive à próxima.
    branches: [ 'claude/**' ]
    paths:
      - 'scripts/lib/motor/**'
      - 'scripts/lib/alfa-parse.mjs'
      - 'scripts/lib/hasta-parse.mjs'
      - 'scripts/lib/nordeste-parse.mjs'
      - 'scripts/lib/nordeste-veiculo.mjs'
      - 'scripts/scraper-nordeste-veiculos.mjs'
      - 'scripts/lib/jeleiloes-parse.mjs'
      - 'scripts/lib/leilaoindex-parse.mjs'
      - 'scripts/lib/rocha-parse.mjs'
      - 'scripts/lib/softgt-parse.mjs'
      - 'scripts/lib/nortedeminas-parse.mjs'
      - 'scripts/scraper-softgt.mjs'
      - 'scripts/scraper-nortedeminas.mjs'
      - 'scripts/lib/leilaoeletronico-parse.mjs'
      - 'scripts/scraper-leilaoeletronico.mjs'
      - 'scripts/lib/suportev2-parse.mjs'
      - 'scripts/scraper-suportev2.mjs'
      - 'scripts/lib/suporte-next-parse.mjs'
      - 'scripts/lib/suporte-classico-parse.mjs'
      - 'scripts/lib/motor/fontes/lancevip.mjs'
      - 'scripts/lib/motor/fontes/vixleiloes.mjs'
      - 'scripts/lib/motor/fontes/portaldosleiloes.mjs'
      - 'scripts/lib/motor/fontes/suporteclassico.mjs'
      - 'scripts/scraper-suportenext.mjs'
      - 'scripts/lib/leilovia-parse.mjs'
      - 'scripts/lib/motor/fontes/leilovia.mjs'
      - 'scripts/scraper-leilovia.mjs'
      - 'scripts/lib/labasoft-parse.mjs'
      - 'scripts/lib/motor/fontes/labasoft.mjs'
      - 'scripts/scraper-labasoft.mjs'
      - 'scripts/lib/baston-parse.mjs'
      - 'scripts/lib/cassiano-parse.mjs'
      - 'scripts/lib/arnaldo-parse.mjs'
      - 'scripts/scraper-baston.mjs'
      - 'scripts/scraper-cassiano.mjs'
      - 'scripts/scraper-arnaldo.mjs'
      - 'scripts/lib/albertomacedo-parse.mjs'
      - 'scripts/lib/francoleiloes-parse.mjs'
      - 'scripts/lib/simon-parse.mjs'
      - 'scripts/lib/globo-json.mjs'
      - 'scripts/lib/leje-parse.mjs'
      - 'scripts/lib/dom-parse-util.mjs'
      - 'scripts/scraper-alfa.mjs'
      - 'scripts/scraper-hasta.mjs'
      - 'scripts/scraper-nordeste.mjs'
      - 'scripts/scraper-jeleiloes.mjs'
      - 'scripts/scraper-leilaoindex.mjs'
      - 'scripts/scraper-rocha.mjs'
      - 'scripts/scraper-albertomacedo.mjs'
      - 'scripts/scraper-francoleiloes.mjs'
      - 'scripts/scraper-simon.mjs'
      - 'scripts/scraper-globo.mjs'
      - 'scripts/scraper-leje.mjs'
      - 'scripts/scraper-freitas.mjs'
      - 'scripts/lib/freitas-parse.mjs'
      - 'scripts/lib/motor/fontes/freitas.mjs'
      - 'scripts/scraper-leiloar.mjs'
      - 'scripts/lib/leiloar-parse.mjs'
      - 'scripts/lib/motor/fontes/leiloar.mjs'
      - 'scripts/scraper-lgcorretor.mjs'
      - 'scripts/lib/lgcorretor-parse.mjs'
      - 'scripts/scraper-nakakogue.mjs'
      - 'scripts/lib/nakakogue-parse.mjs'
      - 'scripts/scraper-astavero.mjs'
      - 'scripts/lib/astavero-json.mjs'
      - 'scripts/scraper-comprei.mjs'
      - 'scripts/lib/comprei-pgfn.mjs'
      - 'scripts/scraper-leilo.mjs'
      - 'scripts/lib/leilo-parse.mjs'
      - 'scripts/lib/motor/fontes/leilo.mjs'
      - 'scripts/scraper-lucian.mjs'
      - 'scripts/lib/lucian-parse.mjs'
      - 'scripts/lib/motor/fontes/lucian.mjs'
      - 'scripts/scraper-alliance.mjs'
      - 'scripts/lib/alliance-parse.mjs'
      - 'scripts/lib/motor/fontes/alliance.mjs'
      - 'scripts/scraper-mvleiloes.mjs'
      - 'scripts/lib/mvleiloes-parse.mjs'
      - 'scripts/lib/motor/fontes/mvleiloes.mjs'
      - 'scripts/scraper-dian.mjs'
      - 'scripts/lib/dian-parse.mjs'
      - 'scripts/lib/motor/fontes/dian.mjs'
      - '.github/workflows/scraper-dom.yml'
  workflow_dispatch:
    inputs:
      fontes:
        description: 'csv: softgt,nortedeminas,leilaoeletronico,suportev2,suportenext,leilovia,labasoft,baston,cassiano,arnaldo,novaserrana(recon),alfa,hasta,nordeste,nordeste_veiculos,jeleiloes,leilaoindex,rocha,albertomacedo,francoleiloes,simon,globo,leje,freitas,leiloar,lgcorretor,nakakogue,astavero,suporteoferta,comprei,leilo,lucian,alliance,mvleiloes,dian'
        required: false
        default: 'alfa,nordeste'
      gravar:
        description: '1 = grava no banco (default DRY-RUN; agendado sempre grava)'
        required: false
        default: '0'
      freitas_bd:
        description: 'Freitas: 1 = passa pelo Bright Data se a via grátis falhar (validação)'
        required: false
        default: '0'

jobs:
  scraper-dom:
    runs-on: ubuntu-latest
    # 40 → 55 (29/09): a rodada agendada já levava ~36 min e a GLOBO (JSON, ~5–7 min/dia) entrou no
    # RODA_TUDO. Estourar o teto CORTA as fontes seguintes (incidente de 10–12/08) — folga de propósito.
    # 24/10: 75 → 120. Com a HASTA em 18 min (teto 120 lotes), a rodada de 23/10 ainda chegou a 70 min no Simon
    # e cortou Globo, Nakakogue, Astavero, Leje, Freitas e o passo de veículos. Repo público = minutos sem custo.
    # 28/10: 120 → 180 e o passo de veículos virou o job `veiculos` (em paralelo). As agendadas de 27 e 28/10
    # estouraram os 120 (Leilão Eletrônico ~32 min): a de 27 cortou do Leiloar em diante; a de 28, os veículos.
    timeout-minutes: 180  # 15/10: era 55; a rodada de 14/10 levou 54:40 e a FRANCO pelo feed (+~4 min) estourou, cortando o Astavero
    env:
      # Nome pelo EFEITO no _DRYRUN de cada fonte (1=dry-run, 0=grava) — não pelo gatilho.
      # (achado 07/09, revisão externa: "GRAVA" antes chamava 1 de "grava", exatamente o
      # oposto do que o valor faz — funcionava certo, só confundia quem lesse depois.)
      DRYRUN_PADRAO: ${{ (github.event_name == 'schedule' || github.event.inputs.gravar == '1') && '0' || '1' }}
      RODA_TUDO: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Alfa
        if: ${{ env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'alfa') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALFA_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-alfa.mjs

      - name: Hasta
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'hasta')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_ISP_HOST: ${{ secrets.BRIGHTDATA_ISP_HOST }}
          BRIGHTDATA_ISP_USER: ${{ secrets.BRIGHTDATA_ISP_USER }}
          BRIGHTDATA_ISP_PASS: ${{ secrets.BRIGHTDATA_ISP_PASS }}
          HASTA_DRYRUN: ${{ env.DRYRUN_PADRAO }}
          # 23/10 (#280): com 600 o run relia os 488 lotes todo dia (62 min) e estourava o teto do job,
          # pulando as ~25 fontes seguintes (veículos inclusive). 120 = lote novo primeiro + os mais
          # velhos/praça próxima (~16 min); o acervo inteiro cicla em ~4 dias, e o runner residencial
          # segue relendo os 600. A varredura de sumidos depende da LISTA completa, não deste teto.
          HASTA_MAX_LOTES: '120'
        run: node scripts/scraper-hasta.mjs

      - name: Nordeste
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'nordeste')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NORDESTE_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-nordeste.mjs

      - name: Nordeste veículos
        # 30/09 (dono: "só os veículos inteiros da NORDESTE"): os ~400 lotes de bem móvel que o passo
        # acima descarta pela URL — só veículo inteiro (sem sucata/peça), em veiculos_leilao.
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'nordeste_veiculos')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NORDESTE_VEIC_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-nordeste-veiculos.mjs

      - name: Jeleiloes
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'jeleiloes')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JELEILOES_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-jeleiloes.mjs

      - name: Suporte oferta (Rafael, Portella, Fabiano Ayupp, De Paula, Leilões JA, ABA, Araújo, Rapidão Vende)
        # 10/10: achado no radar de editais (DJEN). Server-rendered, fetch grátis — diário.
        # 24/10 (Juntas): + 4 tenants RJ do mesmo front (~71 imóveis no catálogo). Só via grátis (semBD). ~+3 min por rodada
        # em regime (5 páginas de catálogo + até 40 lotes novos/tenant a ~1,5 s); 1ª rodada ~+2 min a mais.
        # 24/10 (pendência 356): + ABA (SE), Araújo (RN/PB) e Rapidão Vende (TO), ~10 imóveis no catálogo.
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'suporteoferta')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPORTEOFERTA_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-suporteoferta.mjs

      - name: Leilo (Goiânia/GO — venda direta + leilões de imóvel)
        # 28/10 (triagem da junta): SSR com o estado do app embutido, fetch grátis — diário. Seco de 28/10: 75 imóveis
        # (67 venda direta + 8 em leilão; GO/MT/DF/SP). ~2 min por rodada (2 páginas + ~15 leilões + até 80 lotes).
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'leilo')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEILO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-leilo.mjs

      - name: Lucian (Caxias do Sul/RS — imóveis RS/SC)
        # 28/10 (medição da junta): home + agenda dos pregões, só a categoria 6 (Imóveis); fetch grátis. Seco de 28/10:
        # 27 imóveis enumerados, 20 abertos prontos (11 cidades de RS/SC, todas no IBGE). ~1–2 min por rodada.
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'lucian')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LUCIAN_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-lucian.mjs

      - name: Alliance (São Paulo/SP — leilões e vendas diretas de imóvel)
        # 28/10 (medição da junta): a home lista ~120 leilões, quase todos antigos (o rótulo "Futuro" não vale) — vira
        # evento só o card com praça futura ou venda direta sem data. Seco de 28/10: 14 leilões, 25 lotes, 11 imóveis
        # prontos (12 carretas e 1 Civic saem como não-imóvel). Fetch grátis; páginas de ~1 s (houve picos de 40–60 s).
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'alliance')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALLIANCE_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-alliance.mjs

      - name: MV Leilões (Rio de Janeiro/RJ — imóveis judiciais)
        # 29/10 (fila dos 58 com imóvel e sem leitor, #380): WordPress, a home lista os 23 imóveis (abertos e encerrados);
        # datas no topo do lote ou, nos encerrados, só no edital. Seco de 29/10: 6 abertos (5 no Rio, 1 hotel em
        # Gramado/RS), 15 encerrados, 2 sem data (saem). Fetch grátis; ~1 min.
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'mvleiloes')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MVLEILOES_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-mvleiloes.mjs

      - name: Leiloeiro Dian (Vacaria/Passo Fundo/Lagoa Vermelha — RS)
        # 29/10 (fila #380): Next.js; a página do item só tem dado depois do JS → fonte `dom` (Chromium deste job).
        # Listagens home + /agenda + /venda-direta, só cards de Imóvel (10 de 29 em 29/10). Venda direta: o preço vem do
        # card. ~12 renders, poucos minutos.
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'dian')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DIAN_DRYRUN: ${{ env.DRYRUN_PADRAO }}
          # O site escreve as praças no fuso de QUEM ABRE a página: o Chromium do runner (UTC) mostrava "17:30" para o
          # leilão das 14:30 de Brasília, e o parser grava com -03:00 (1ª gravação de 29/10 saiu 3 h adiantada).
          TZ: America/Sao_Paulo
        run: node scripts/scraper-dian.mjs

      - name: Comprei (PGFN) — venda direta na origem
        # 10/10: API pública do Comprei (listagem nacional + anúncio). Grátis (direto ou via banco) — diário.
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'comprei')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPREI_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-comprei.mjs

      - name: Leilaoindex
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'leilaoindex')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEILAOINDEX_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-leilaoindex.mjs

      - name: Rocha
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'rocha')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ROCHA_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-rocha.mjs

      # 22/10 (triagem #292): FLEX + LUIZ CARVALHO (plataforma SoftGT) e NORTE DE MINAS (WebAjato) — HTML do
      # servidor, sem Cloudflare; só via grátis (semBD nos wrappers). Medido pelo banco (AWS) com 200.
      - name: SoftGT (Flex, Luiz Carvalho)
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'softgt')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOFTGT_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-softgt.mjs

      - name: Norte de Minas
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'nortedeminas')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NORTEDEMINAS_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-nortedeminas.mjs

      # 23/10 (pendência 307): ~218 imóveis abertos, nacional, feed + página pela via grátis (sem Bright Data).
      # 24/10: + 9 tenants da mesma plataforma Degrau (Destak, Taba, Leilão Oficial, Silva, Pulse, Silveira, Milhão, UP,
      # Select — ~670 imóveis no feed). 1ª rodada ~+25 min pelo banco; depois a releitura é ≤ 60 lotes/tenant/dia.
      - name: Leilão Eletrônico
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'leilaoeletronico')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEILAOELETRONICO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-leilaoeletronico.mjs

      # 24/10 (pendência 296): Marco Antônio, Rodrigo Collyer, Anna Luiza e DCM — o front Next.js novo da Suporte (um
      # banco, quatro vitrines; fonte MARCOANTONIO). Saíram de SUPORTE_TENANTS. ~45 imóveis, via grátis (direto/banco).
      - name: Suporte v2 (Marco Antônio / Rodrigo Collyer)
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'suportev2')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPORTEV2_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-suportev2.mjs

      # 26/10: os fronts Next.js NOVOS da Suporte que nenhum parser lia — LanceVIP (~26 imóveis, RO/PR/SC), VIX (ES),
      # Portal dos Leilões (AL, catálogo de imóveis vazio hoje) — e o front clássico /categoria/ (Simões, VJ, Marco
      # Aurélio; vazios ou só lote encerrado hoje). Ligados mesmo vazios. Uma fonte por site; só via grátis.
      - name: Suporte Next (LanceVIP / VIX / Portal dos Leilões / clássico)
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'suportenext')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPORTENEXT_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-suportenext.mjs

      - name: Baston
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'baston')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BASTON_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-baston.mjs

      - name: Glener Brasil Cassiano
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'cassiano')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CASSIANO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-cassiano.mjs

      - name: Arnaldo
        # Só por dispatch: o GitHub leva 403 no AJAX de valores — a coleta de verdade é no runner residencial.
        if: ${{ !cancelled() && contains(github.event.inputs.fontes, 'arnaldo') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ARNALDO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-arnaldo.mjs

      # Recon em seco do portal Nova Serrana (#292) — só por dispatch; vira coletor depois de medir o JSON.
      - name: Recon Nova Serrana (em seco)
        if: ${{ !cancelled() && contains(github.event.inputs.fontes, 'novaserrana') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/recon-novaserrana.mjs

      - name: Albertomacedo
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'albertomacedo')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALBERTOMACEDO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-albertomacedo.mjs

      - name: Francoleiloes
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'francoleiloes')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRANCOLEILOES_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-francoleiloes.mjs

      - name: Simon
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'simon')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SIMON_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-simon.mjs

      - name: Leiloar (Uberlândia, Nasar, Rodrigo, Marques Barreto, Lucas Ignacio, Moacira, IPC)
        # 25/10 (#356): + 6 tenants — o 2º template da plataforma (Bootstrap "responsivo") e o IPC. Seco no HTML real:
        # Nasar 22 prontos, Moacira 5, Rodrigo 3, Marques Barreto 2, IPC 2, Lucas Ignacio 0 (só móveis/cancelados hoje).
        # 28/09: Plataforma Leiloar, HTML estático sem Cloudflare neste tenant — grátis (semBD).
        # Fora do RODA_TUDO: o dry-run de 28/09 (run 36440506134) levou HTTP 403 do IP do runner
        # (Azure) na home — o MESMO site respondeu 200 ao servidor do banco (AWS) no recon.
        # Bloqueio por faixa de IP, não por cabeçalho — e o PC do dono também levou 403 (28-29/09).
        # 29/09: DE VOLTA AO RODA_TUDO. O motor ganhou a via "banco" (pg_net, IP da AWS, grátis —
        # lib/motor/fetch-fonte.mjs): o dry-run do push (run 36597829115) enumerou 16 lotes, 13
        # prontos, foto 85%, tudo "via banco". Agendado grava todo dia; o runner do PC vira reserva.
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'leiloar')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEILOAR_DRYRUN: ${{ env.DRYRUN_PADRAO }}
          LEILOAR_MAX_LOTES: '80'
        run: node scripts/scraper-leiloar.mjs

      # 25/10 (#356): Plataforma Leilovia (ASP.NET) — Casa de Leilões e RP Leilões (MS). O IIS dá 400 ao cabeçalho de
      # navegador e 200 sem cabeçalho (o motor tenta a forma pelada depois do 400). Grátis, sem Bright Data.
      - name: Leilovia (Casa de Leilões, RP Leilões)
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'leilovia')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEILOVIA_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-leilovia.mjs

      # 25/10 (#356): Plataforma Labasoft (PHP) — Schulmann, Karla Pepe e Leilões Braga (RJ). HTML estático, sem
      # Cloudflare; grátis, sem Bright Data. Seco: Schulmann 14/14 prontos (amostra de ~62); Karla e Braga 0 hoje.
      - name: Labasoft (Schulmann, Karla Pepe, Leilões Braga)
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'labasoft')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LABASOFT_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-labasoft.mjs

      - name: LG Corretor Judicial (venda direta judicial)
        # 28/09: alienação judicial por iniciativa particular (CPC 880), incluída por decisão do dono.
        # Busca pública renderizada pelo servidor (a API /api/* exige credencial e NÃO é usada).
        # ~20 requisições/dia, grátis, sem Bright Data. Parser: lib/lgcorretor-parse.mjs.
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'lgcorretor')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LGCORRETOR_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-lgcorretor.mjs

      - name: Globo
        # [HISTÓRICO, superado em 29/09 — ver abaixo] Não entrava em env.RODA_TUDO (17/09, retestado 20/09 com proxy ISP — não resolveu,
        # ver globo.mjs): site atrás de Cloudflare que reage a mais que reputação de IP. A
        # produção de verdade é scripts/runner-residencial.sh (IP residencial, mesmo remédio
        # de RJ/GESTAO/PECINI). Continua rodando no PUSH como sinalizador — se o Cloudflare
        # cair um dia, o push mostra lotes de novo e vale reconsiderar entrar no RODA_TUDO.
        # 29/09: coletor reescrito para o JSON `data-page` (lib/globo-json.mjs). Dry-run (run
        # 36606384912): 747 enumerados, 715 prontos, detalhe 400/400 — tudo pela via banco (a CI leva
        # 403 no fetch direto; o banco recebe 200). DE VOLTA AO RODA_TUDO.
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'globo')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GLOBO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-globo.mjs

      # NAKAKOGUE (05/10, #41): 2 páginas por execução (catálogo de imóveis + home) e 1 PDF por
      # leilão sem cidade; `semBD` no wrapper — custo Bright Data zero por construção.
      - name: Nakakogue
        if: ${{ !cancelled() && (env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'nakakogue')) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NAKAKOGUE_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-nakakogue.mjs

      # ASTAVERO (05/10, #41): API JSON da plataforma (POST, sem login/Cloudflare) — custo zero. Desde 26/10 roda no
      # próprio workflow (scraper-astavero.yml, 38 tenants); aqui só quando pedido pelo nome no dispatch.
      - name: Astavero
        if: ${{ !cancelled() && contains(github.event.inputs.fontes, 'astavero') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ASTAVERO_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-astavero.mjs

      - name: Leje
        # 27/09: fora do RODA_TUDO — o site dá 403 ao IP do runner desde 24/09 e o proxy ISP não
        # resolve (ver leje.mjs). Produção: scripts/runner-residencial.sh.
        # 30/09: SÓ por dispatch. No push, cada commit batia no site a partir do Azure — a Cloudflare
        # da LEJE responde "acesso temporariamente bloqueado" e o monitor enchia de `falhou` que não
        # vinha da coleta de produção (4 das 6 falhas de 30/09 eram push).
        # 10/10: busca pelo Firecrawl (passa o Cloudflare; 1 crédito/página, teto por execução).
        # 1ª coleta real (run 38074812502): ok, 3 lotes. O AGENDADO é SEMANAL e mora em
        # scraper-firecrawl-semanal.yml (dono, 10/10: crédito pago → 1x por semana). Aqui só dispatch.
        if: ${{ !cancelled() && contains(github.event.inputs.fontes, 'leje') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_MAX_PAGINAS: '40'
          LEJE_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-leje.mjs

      - name: Freitas
        # 27/09: freitasleiloeiro.com.br (imóveis). O site recusa o IP do runner (dry-run 27/09:
        # via grátis vazia) — produção é scripts/runner-residencial.sh, grátis. Aqui: push como
        # sinalizador; dispatch com `freitas_bd=1` passa pelo Bright Data (~13 req.) só para
        # validar parser de ponta a ponta sem depender do computador de casa.
        if: ${{ !cancelled() && contains(github.event.inputs.fontes, 'freitas') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          FREITAS_BD: ${{ github.event.inputs.freitas_bd || '0' }}
          FREITAS_DRYRUN: ${{ env.DRYRUN_PADRAO }}
        run: node scripts/scraper-freitas.mjs

      # VEÍCULOS das fontes do motor deste job (21/10, pedido do dono): JE/K Leilões (/veiculos), Simon
      # (/leiloes/veiculos), Nakakogue (/lotes/consulta/2). Mesmo parser de cada fonte; conversão e pátio em
      # lib/veiculo-do-lote.mjs. Só via grátis (VEIC_BD desligado).
      - name: Notify on failure
        # `cancelled()` também: estourar o timeout-minutes não é `failure()` pro GitHub, e sem
        # isto uma rodada agendada cortada no meio termina sem aviso nenhum (mesma lição já
        # documentada em scraper.yml/CEF — silêncio de 3 dias de coleta truncada).
        if: ${{ github.event_name == 'schedule' && (failure() || cancelled()) }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -s -L --post301 --post302 --post303 -X POST "${APP_BASE_URL:-https://bidprobrasil.com.br}/api/notify-scraper" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"Scraper DOM","etapa":"'"$JOB_STATUS"'","run_id":"'$GITHUB_RUN_ID'","run_url":"https://github.com/'$GITHUB_REPOSITORY'/actions/runs/'$GITHUB_RUN_ID'"}' || true
        continue-on-error: true

  # 28/10: era o ÚLTIMO passo do job acima e o primeiro a ser cortado quando ele estoura o teto (cortado
  # em 27 e 28/10). Tabela própria (veiculos_leilao) — roda em paralelo, sem esperar as fontes de imóvel.
  veiculos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRYRUN_PADRAO: ${{ (github.event_name == 'schedule' || github.event.inputs.gravar == '1') && '0' || '1' }}
      RODA_TUDO: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Veículos (Globo, JE, Simon, Nakakogue, Suporte v2, VIX, LanceVIP, Portal dos Leilões)
        if: ${{ env.RODA_TUDO == 'true' || contains(github.event.inputs.fontes, 'veiculos') }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VEIC_FONTES: globo,jeleiloes,simon,nakakogue,suportev2,vixleiloes,lancevip,portaldosleiloes
          VEIC_DRYRUN: ${{ env.DRYRUN_PADRAO }}
          VEIC_MAX_LOTES: '80'
        run: node scripts/scraper-veiculos-motor.mjs

      - name: Notify on failure
        if: ${{ github.event_name == 'schedule' && (failure() || cancelled()) }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -s -L --post301 --post302 --post303 -X POST "${APP_BASE_URL:-https://bidprobrasil.com.br}/api/notify-scraper" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"Scraper DOM (veículos)","etapa":"'"$JOB_STATUS"'","run_id":"'$GITHUB_RUN_ID'","run_url":"https://github.com/'$GITHUB_REPOSITORY'/actions/runs/'$GITHUB_RUN_ID'"}' || true
        continue-on-error: true
