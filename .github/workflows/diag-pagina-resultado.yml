name: Diagnóstico de página de resultado (só leitura)
on:
  workflow_dispatch:
    inputs:
      urls: { description: 'URLs de lote separadas por espaço', required: true }
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts
      - env: { PAGINAS_DIAG: '${{ inputs.urls }}' }
        run: node scripts/diag-pagina-resultado.mjs
