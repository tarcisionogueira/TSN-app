name: Scraper EMILIOMATOS (Superbid/MBV SSR)

# emiliomatosleiloes.com.br — plataforma Superbid/MBV white-label, SSR. Listagem
# /busca/segmento/imoveis?page=N. Site atrás de Cloudflare → Bright Data (respeitando a cota
# semanal via proposito 'emiliomatos') ou IP residencial. Fluxo recon-first: DEBUG → dry → grava.
# No cron GRAVA; no dispatch manual é dry-run por padrão (dryrun=0 p/ gravar).
# ⛔ CRON SUSPENSO EM 29/08 — A FONTE GRAVA LOTE DE OUTRO LEILOEIRO
#
# O dry-run multi-tenant (rodado do IP residencial) provou que `/busca/segmento/imoveis` num
# white-label Superbid devolve o CATÁLOGO GLOBAL da plataforma, e não o acervo do leiloeiro
# dono do site. Quatro sites distintos enumeraram os MESMOS 75 lotes, com os MESMOS ids:
#
#   emiliomatos_125319 · bhleiloaria_125319 · franciscodavid_125319 · denis_125319
#     → todos "Casa A.T. 150 m² - Vila Mariana, Morungaba/SP"
#
# Ou seja: os lotes gravados sob a fonte EMILIOMATOS são de OUTROS leiloeiros. O cliente lê
# "Emílio Matos Leilões" num imóvel que não é dele. Não é regressão nova — é como a fonte
# sempre funcionou; o multi-tenant só deu o instrumento para enxergar.
#
# O cron fica comentado (o `workflow_dispatch` continua, para o recon) até um recon achar o
# caminho que lista SÓ o acervo do leiloeiro — o mesmo método que resolveu VIP e SUPORTE.
# Para religar: descomente as duas linhas abaixo. Reversível de propósito.
on:
  # schedule:
  #   - cron: '40 10 * * 3'   # 1x/semana (quarta), 10:40 UTC
  workflow_dispatch:
    inputs:
      forcar:
        # 29/08 — POR QUE ESTE INPUT EXISTE, e por que o freio deixou de ignorar o dispatch:
        # o `if` deste job era `github.event_name != 'schedule' || pular != '1'`, escrito quando
        # dispatch significava "um humano clicou". Desde que `api/coleta-oportunista.js` passou a
        # disparar estes workflows sempre que o staff abre o app (espacamento de 20h), dispatch
        # virou um evento AUTOMATICO DIARIO — e a condicao antiga fazia o freio de custo nao valer
        # justamente no caminho que mais roda. Medido: os 4 workflows pagos rodaram por dispatch
        # TODOS OS DIAS de 08/08 a 29/08, e em 29/08 dispararam as 10:29 UTC (todos `sem_cota`)
        # sobre as MESMAS fontes que o runner residencial coletou de graca as 13:02.
        # Agora o freio vale para schedule E para o disparo oportunista; quem clica de proposito
        # e quer pagar mesmo com acervo fresco passa forcar=1.
        description: '1 = ignora o freio de frescor (paga Bright Data mesmo com acervo fresco)'
        required: false
        default: '0'
      debug:
        description: '1 = RECON (dumpa listagem + 1 detalhe)'
        required: false
        default: '0'
      dryrun:
        description: '1 = dry-run (não grava); 0 = grava'
        required: false
        default: '1'
      max_lotes:
        description: 'Máx. de lotes NOVOS por execução'
        required: false
        default: '40'
      max_pages:
        description: 'Máx. de páginas da listagem a enumerar'
        required: false
        default: '15'

jobs:
  scraper-emiliomatos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      # REDE DE SEGURANÇA: o cron pago só roda se o runner residencial (grátis) não coletou
      # a fonte nos últimos 7 dias.
      # ⚠️ O freio vale para o cron E para o disparo oportunista (dispatch sem inputs).
      # Só `forcar=1` passa por cima — ver o comentário do input, com a medição de 29/08.
      - name: Freio residencial (pula se coletado de casa há < 7 dias)
        id: freio
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/coleta-recente.mjs EMILIOMATOS 7 >> "$GITHUB_OUTPUT"
      - name: Rodar scraper EMILIOMATOS
        if: github.event.inputs.forcar == '1' || steps.freio.outputs.pular != '1'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_MAX_REQ_SEMANA: ${{ secrets.BRIGHTDATA_MAX_REQ_SEMANA }}
          EMILIOMATOS_DEBUG: ${{ github.event.inputs.debug || '0' }}
          EMILIOMATOS_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          EMILIOMATOS_MAX_LOTES: ${{ github.event.inputs.max_lotes || '40' }}
          EMILIOMATOS_MAX_PAGES: ${{ github.event.inputs.max_pages || '15' }}
        run: node scripts/scraper-emiliomatos.mjs
