name: Leiloeiros — Scraper Puppeteer Diário

on:
  schedule:
    - cron: '0 10 * * 1,4'   # 2x/semana (seg e qui), 10h UTC — após o CEF; fontes grátis
  workflow_dispatch:
    inputs:
      fontes:
        description: 'Fontes a rodar (vazio = todas). Ex.: VENDASGOV ou MEGA,SOLD'
        required: false
        default: ''
      ljud_debug:
        description: '1 = dumpa a estrutura do bem LJUD (recon da URL do lote)'
        required: false
        default: '0'

jobs:
  scraper-puppeteer:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Run Puppeteer scraper
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_FONTES: ${{ github.event.inputs.fontes }}
          LJUD_DEBUG: ${{ github.event.inputs.ljud_debug || '0' }}
        run: node scripts/scraper-puppeteer.mjs

      - name: Notify on failure
        if: failure()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          curl -s -X POST "${APP_BASE_URL:-https://bidprobrasil.com.br}/api/notify-scraper" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"Scraper Leiloeiros","run_id":"'$GITHUB_RUN_ID'","run_url":"https://github.com/'$GITHUB_REPOSITORY'/actions/runs/'$GITHUB_RUN_ID'"}' || true
