name: Fotos CEF — Capturar galeria no Storage (manual)

# 18/09: deixou de ser no-op. O `link_foto` (capa, hotlink) continua vindo do scraper
# principal (`api/scraper-caixa.js`) — este script agora busca a GALERIA de fotos de
# cada imóvel (até 8) e grava em `imoveis_leilao.fotos`, para o relatório documental
# cruzar com o estado construtivo do imóvel (risco de acessão/benfeitoria — pedido do
# dono). Alvo é `fotos is null`, então roda incremental sem reprocessar quem já tem
# galeria. Ainda manual: falta decidir se isso vira agendado (custo de execução × CEF
# ser 72% do acervo ativo) — não mudar para `schedule` sem essa decisão.
on:
  workflow_dispatch:

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Download fotos CEF → Supabase Storage
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/foto-cef.mjs

      - name: Notify on failure
        # `cancelled()` tambem: estourar o timeout-minutes nao e `failure()` para o GitHub,
        # entao sem isto a rodada cortada no meio termina sem aviso nenhum.
        if: failure() || cancelled()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -s -X POST "${APP_BASE_URL:-https://bidprobrasil.com.br}/api/notify-scraper" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"Fotos CEF","etapa":"'"$JOB_STATUS"'","run_id":"'$GITHUB_RUN_ID'","run_url":"https://github.com/'$GITHUB_REPOSITORY'/actions/runs/'$GITHUB_RUN_ID'"}' || true
        continue-on-error: true
