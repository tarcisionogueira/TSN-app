name: Recon — trecho do lote no edital do veículo (só leitura)

# 25/09: lê cada edital de evento de veículo uma vez e imprime a origem da venda que ele indica ×
# a que o sistema tem hoje. Só leitura; sem Bright Data. Ver scripts/recon-edital-trecho-lote.mjs.
on:
  push:
    branches: [ 'claude/bidpro-brasil-registros-handoff-eulqvz' ]
    paths: [ 'scripts/recon-edital-trecho-lote.mjs', '.github/workflows/recon-edital-trecho-lote.yml' ]
  workflow_dispatch: {}

jobs:
  seco:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Em seco
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/recon-edital-trecho-lote.mjs
