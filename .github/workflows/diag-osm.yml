name: DIAG OSM (descartável)

on:
  workflow_dispatch:

jobs:
  diag-osm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnóstico Overpass
        run: node scripts/diag-osm.mjs
