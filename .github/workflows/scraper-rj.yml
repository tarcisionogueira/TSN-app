name: Scraper RJ Leilões (Bright Data)

# RJ Leilões está 100% atrás de Cloudflare (Puppeteer barrado até no Actions), então
# a coleta usa o Bright Data Web Unlocker. Validado (recon → dry-run → gravação).
# Custo: ~13 requests/coleta (RJ é pequeno, ~12 imóveis) — teto semanal + RESERVA 'rj'
# de 60 req/semana (migração brightdata_reserva_por_proposito.sql). Duas coletas/semana
# cabem folgadas na reserva.
#
# 2x/semana (ter/sex), como o comentário sempre dizia — o cron era só terça. Com o
# residencial finalmente gravando (faltava RJ_DRYRUN=0 no runner), a terça costuma ser
# pulada pelo freio; a sexta é a rede de segurança quando a coleta de casa não passa.
#
# dryrun default '0' (GRAVA) desde 11/08: com default '1' os oito dispatches manuais de
# 02/08 a 11/08 gastaram cota do Bright Data e não gravaram uma linha — todos verdes.
# Quem quiser inspecionar sem gravar passa dryrun=1 explicitamente.
on:
  schedule:
    # 1x POR SEMANA (29/08, decisão do dono: "os que usam bright data coloque para rodar
    # somente 1x por semana"). Era terça E sexta. A segunda rodada era "rede de segurança se o
    # residencial não passou" — mas ela custava uma cota inteira toda semana para cobrir um
    # caso que o monitor de fontes já denuncia (`fonte_regressao_suspeita`), sem gastar nada.
    # Se a terça falhar, o disparo manual resolve; pagar por uma segunda passada preventiva
    # toda semana, em uma cota que vive saturada, é o oposto de economia.
    - cron: '0 11 * * 2'   # terça, 11 UTC — fonte PAGA (Bright Data)
  workflow_dispatch:
    inputs:
      debug:
        description: '1 = RECON (dumpa sitemap + 1 lote p/ afinar o parser)'
        required: false
        default: '0'
      dryrun:
        description: '1 = dry-run (não grava); 0 = grava'
        required: false
        default: '0'
      max_lotes:
        description: 'Máx. de lotes por execução'
        required: false
        default: '40'

jobs:
  scraper-rj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      # REDE DE SEGURANÇA (decisão do dono): este cron pago só roda se o runner
      # RESIDENCIAL (grátis) não coletou a fonte nos últimos 7 dias. Dispatch manual
      # ignora o freio (quem clica sabe o que quer).
      - name: Freio residencial (pula se coletado de casa há < 7 dias)
        id: freio
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/coleta-recente.mjs RJ 7 >> "$GITHUB_OUTPUT"
      - name: Rodar scraper RJ
        if: github.event_name != 'schedule' || steps.freio.outputs.pular != '1'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_MAX_REQ_SEMANA: ${{ secrets.BRIGHTDATA_MAX_REQ_SEMANA }}
          BRIGHTDATA_MAX_RJ_SEMANA: ${{ secrets.BRIGHTDATA_MAX_RJ_SEMANA }}
          RJ_DEBUG: ${{ github.event.inputs.debug || '0' }}
          # cron (sem inputs) → '' → grava; dispatch manual sem dryrun → default '1' (dry-run).
          RJ_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          RJ_MAX_LOTES: ${{ github.event.inputs.max_lotes || '40' }}
        run: node scripts/scraper-rj.mjs
