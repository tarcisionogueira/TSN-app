name: _temp Recon LJUD lote (só leitura)

# 07/10: lote ljud_217021 sem data e com valor de participação errado; 83% dos LJUD sem avaliação.
# Lê a página do lote (API do portal) e o edital, grava em recon_dump. Não toca no acervo. Apagar depois.
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Chromium deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - name: Recon
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LJUD_LOTES: '99369/217021'
          EDITAL_217021: 'https://s3-sa-east-1.amazonaws.com/906de634c48fb7d34136160b4c353ae4/public/anexo/4305391788893631.pdf'
        run: node scripts/recon-ljud-lote.mjs
