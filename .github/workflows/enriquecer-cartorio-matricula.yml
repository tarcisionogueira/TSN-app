name: Enriquecer Cartório/Ofício (matrícula PDF)

# Backfill grátis de cartório/ofício/comarca lendo o TEXTO da matrícula (PDF).
# Sem IA e sem OCR — roda no runner do GitHub. Rede OPORTUNISTA: a maioria dos
# lotes não-CEF NÃO pré-armazena o PDF da matrícula (documentos são buscados sob
# demanda), e alguns leiloeiros (ex.: Superbid) bloqueiam download direto (403,
# só IP residencial). Então este cron captura apenas os casos com matrícula em
# PDF de texto e download livre. A cobertura principal do cartório para não-CEF
# vem do LAUDO DOCUMENTAL (que lê a matrícula sob demanda). Semanal para não
# gerar execução diária à toa.
on:
  schedule:
    # Semanal (domingo, madrugada BRT).
    - cron: '20 6 * * 0'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Máx. de matrículas por execução'
        required: false
        default: '3000'

# Sem sobreposição de execuções (evita trabalho duplicado).
concurrency:
  group: enriquecer-cartorio-matricula
  cancel-in-progress: false

jobs:
  enriquecer-cartorio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Enriquecer cartório/ofício (matrícula)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MATRICULA_LIMITE: ${{ github.event.inputs.limite || '3000' }}
        run: node scripts/enriquecer-cartorio-matricula.mjs
