name: _temp Recon de datas (só leitura)

# 06/10: invariante data_edital_recuou_prazo (LEILAOBRASIL 3801). Lê página e edital e grava as datas
# encontradas em recon_dump. Não toca no acervo. Apagar depois.
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recon
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RECON_URLS: 'https://www.leilaobrasil.com.br/eventos/leilao/3801/apartamento-em-guarulhos/lote,https://static.suporteleiloes.com.br/leilaobrasilcombr/leiloes/3801/documentos/sl-doc-3801-6a7f04f6c1061-6a7f04f6c180d.doc'
        run: node scripts/recon-datas-pagina.mjs
