name: Radar leilões MJ/SENAD (Power BI)

# Puxa o calendário oficial de leilões do MJ (Power BI público) p/ leiloes_mj_radar e cruza
# com o acervo. Fonte adicional/cruzamento. No cron GRAVA; no dispatch é dry-run por padrão.
on:
  schedule:
    - cron: '0 8 * * 1'   # segunda 08:00 UTC
  workflow_dispatch:
    inputs:
      dryrun:
        description: '1 = só extrai (dry-run); 0 = grava'
        required: false
        default: '1'

jobs:
  radar-mj:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Extrair calendário do MJ
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MJ_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
        run: node scripts/scraper-powerbi-mj.mjs
