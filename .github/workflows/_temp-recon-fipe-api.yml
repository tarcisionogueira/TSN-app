name: _temp Recon FIPE API

on:
  workflow_dispatch:

jobs:
  recon-fipe-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recon FIPE API
        run: node scripts/recon-fipe-api.mjs
