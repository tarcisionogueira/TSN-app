name: Recon LEILOFY valor (lance mínimo errado)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'IDs de lote (vírgula). Ex.: 1676 ou 1676,1677'
        required: false
        default: '1676'

jobs:
  recon-leilofy-valor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0
      - name: Recon LEILOFY valor
        env:
          LEILOFY_IDS: ${{ github.event.inputs.ids }}
        run: node scripts/recon-leilofy-valor.mjs
