name: Matrícula Grupo Lance — captura em lote

# A matrícula do Grupo Lance é PÚBLICA no CDN (mesmo caminho do edital). Este job
# deriva a URL e baixa em lote → Storage + imovel_anexos. Sem login/credencial.
on:
  schedule:
    - cron: '35 */6 * * *'   # 4x/dia
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos lotes tentar nesta rodada'
        required: false
        default: '30'

concurrency:
  group: matricula-grupolance
  cancel-in-progress: false

jobs:
  matricula:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Capturar matrículas Grupo Lance → Storage + imovel_anexos
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GL_MATRICULA_LOTE: ${{ github.event.inputs.lote || '30' }}
        run: node scripts/captura-matricula-grupolance.mjs
