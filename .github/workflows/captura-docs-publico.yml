name: Documentos públicos por leiloeiro (sem login)

# Backfill de documentos PÚBLICOS (edital/matrícula/laudo) para fontes cujo doc é
# PDF público no CDN (MEGA, BIASI, …). Preenche imoveis_leilao.anexos + link_matricula.
# Sem credencial. Rodar por dispatch (uma fonte por vez) ou no schedule.
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Fonte (ex.: MEGA, BIASI)'
        required: true
      lote:
        description: 'Quantos lotes por rodada'
        required: false
        default: '120'

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Backfill documentos públicos
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PUB_FONTE: ${{ github.event.inputs.fonte }}
          PUB_LOTE: ${{ github.event.inputs.lote || '120' }}
        run: node scripts/captura-docs-publico.mjs
