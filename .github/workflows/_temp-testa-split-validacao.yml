name: _temp testa validacao pix parcial (descartável)
on:
  workflow_dispatch:

jobs:
  testa:
    runs-on: ubuntu-latest
    steps:
      - name: Testar rejeição de valor_pix_parcial acima do saldo (não deve criar cobrança real)
        run: |
          echo "--- teste 1: valor_pix_parcial acima do saldo (esperado: 400) ---"
          curl -sS -L -w "\nHTTP:%{http_code}\n" -X POST "https://bidprobrasil.com.br/api/mp-checkout" \
            -H "Content-Type: application/json" \
            -d '{"valor":1,"descricao":"teste","email":"teste@teste.com","proposito":"honorario_exito","arrematacao_id":"fb02770c-cfda-4f8e-a9ea-8808775bc804","metodoPagamento":"pix","valor_pix_parcial":99999999}'
          echo "--- teste 2: valor_pix_parcial abaixo do piso R\$5 (esperado: 400) ---"
          curl -sS -L -w "\nHTTP:%{http_code}\n" -X POST "https://bidprobrasil.com.br/api/mp-checkout" \
            -H "Content-Type: application/json" \
            -d '{"valor":1,"descricao":"teste","email":"teste@teste.com","proposito":"honorario_exito","arrematacao_id":"fb02770c-cfda-4f8e-a9ea-8808775bc804","metodoPagamento":"pix","valor_pix_parcial":2}'
          echo "--- teste 3: cobranca_avulsa inexistente com valor_pix_parcial (esperado: 404, nao 500) ---"
          curl -sS -L -w "\nHTTP:%{http_code}\n" -X POST "https://bidprobrasil.com.br/api/mp-checkout" \
            -H "Content-Type: application/json" \
            -d '{"valor":1,"descricao":"teste","email":"teste@teste.com","proposito":"cobranca_avulsa","cobranca_id":"00000000-0000-0000-0000-000000000000","metodoPagamento":"pix","valor_pix_parcial":10}'
          echo "--- teste 4: honorario-info devolve honorarios_partes (deploy do recibo no ar) ---"
          curl -sS -L "https://bidprobrasil.com.br/api/honorario-info?id=fb02770c-cfda-4f8e-a9ea-8808775bc804"
