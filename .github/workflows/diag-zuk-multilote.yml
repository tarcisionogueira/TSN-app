name: diag-zuk-multilote (TEMPORÁRIO)
on:
  push:
    branches: [ 'claude/quirky-knuth-w4gr7a' ]
    paths: [ 'scripts/diag-zuk-multilote.mjs', '.github/workflows/diag-zuk-multilote.yml' ]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node scripts/diag-zuk-multilote.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
